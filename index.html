<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>絵本風リズムゲーム</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #fdfbf7;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            touch-action: none;
            user-select: none;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 450px;
            max-height: 800px;
            background: #fffdf9;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            border-radius: 20px;
            overflow: hidden;
            border: 8px solid #f0e6d2;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(253, 251, 247, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        h1 {
            color: #7c6f64;
            font-size: 28px;
            margin-bottom: 10px;
        }
        p {
            color: #a89f91;
            font-size: 14px;
            margin-bottom: 30px;
        }
        button {
            background-color: #e3c4a8;
            color: #fff;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(227, 196, 168, 0.4);
            transition: 0.2s;
        }
        button:active {
            transform: scale(0.95);
        }
        #score-board {
            position: absolute;
            top: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            color: #7c6f64;
            font-size: 20px;
            font-weight: bold;
            pointer-events: none;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="score-board">スコア: 0</div>
    <div id="start-screen">
        <h1>おひめさまの音楽会</h1>
        <p>外側の丸い枠をタップしてね</p>
        <button id="start-btn">はじめる</button>
    </div>
    <canvas id="gameCanvas"></canvas>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
    canvas.width = canvas.parentElement.clientWidth;
    canvas.height = canvas.parentElement.clientHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

let gameState = 'START';
let score = 0;
let audioCtx = null;
let startTime = 0;

let centerX, centerY;
function updateCenter() {
    centerX = canvas.width / 2;
    centerY = canvas.height / 2 + 30;
}
updateCenter();

const outerRadius = Math.min(canvas.width, canvas.height) * 0.42;
const targetRadius = 35; // 外側の判定枠の大きさ
const noteSpeed = 2.5;

// 5方向の角度（上を起点に綺麗に配置）
const lanes = [
    -Math.PI / 2,
    -Math.PI / 2 + (Math.PI * 2 / 5) * 1,
    -Math.PI / 2 + (Math.PI * 2 / 5) * 2,
    -Math.PI / 2 + (Math.PI * 2 / 5) * 3,
    -Math.PI / 2 + (Math.PI * 2 / 5) * 4
];

let notes = [];
function generateDummyChart() {
    notes = [];
    for (let t = 1.0; t <= 12.0; t += 0.6) {
        let laneIndex = Math.floor(Math.random() * 5);
        notes.push({
            time: t,
            lane: laneIndex,
            hit: false,
            type: 'tap'
        });
    }
}

let animTimer = 0;
let laneHitEffects = [0, 0, 0, 0, 0]; // 各レーンごとのヒットエフェクト用

document.getElementById('start-btn').addEventListener('click', () => {
    document.getElementById('start-screen').style.display = 'none';
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    generateDummyChart();
    startTime = audioCtx.currentTime + 1.0;
    gameState = 'PLAYING';
});

// 各レーンの判定枠がタッチされたときの処理
function handleLaneTap(laneIndex) {
    if (gameState !== 'PLAYING') return;
    
    let currentTime = audioCtx.currentTime - startTime;
    let closestNote = null;
    let minDiff = 999;

    // 該当レーンの中で、一番タイミングが近い未ヒットのノーツを探す
    for (let note of notes) {
        if (!note.hit && note.lane === laneIndex) {
            let diff = Math.abs(currentTime - note.time);
            if (diff < minDiff) {
                minDiff = diff;
                closestNote = note;
            }
        }
    }

    // 許容誤差 0.25秒以内ならヒット
    if (closestNote && minDiff < 0.25) {
        closestNote.hit = true;
        if (minDiff < 0.1) {
            score += 300;
            showFeedback("Great!✨");
        } else {
            score += 100;
            showFeedback("Good♪");
        }
        laneHitEffects[laneIndex] = 15; // 該当レーンを光らせる
        document.getElementById('score-board').innerText = `スコア: ${score}`;
        playHitSound();
    }
}

// タッチ座標からどのレーンが押されたかを判定
window.addEventListener('pointerdown', (e) => {
    if(e.target.tagName === 'BUTTON') return;
    if(gameState !== 'PLAYING') return;

    const rect = canvas.getBoundingClientRect();
    const touchX = e.clientX - rect.left;
    const touchY = e.clientY - rect.top;

    // 5つのターゲット枠のどれに近いかを判定
    for (let i = 0; i < lanes.length; i++) {
        let angle = lanes[i];
        let tx = centerX + Math.cos(angle) * outerRadius;
        let ty = centerY + Math.sin(angle) * outerRadius;
        
        let distance = Math.hypot(touchX - tx, touchY - ty);
        // 判定しやすくするため、枠のサイズより少し広め（1.5倍）にタッチを許容
        if (distance < targetRadius * 1.5) {
            handleLaneTap(i);
            break;
        }
    }
});

function playHitSound() {
    if (!audioCtx) return;
    let osc = audioCtx.createOscillator();
    let gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.1);
}

let feedbackText = "";
let feedbackTimer = 0;
function showFeedback(text) {
    feedbackText = text;
    feedbackTimer = 30;
}

function gameLoop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    updateCenter();

    animTimer += 0.05;

    // 1. 背景の装飾エリア
    ctx.fillStyle = "#faf6ed";
    ctx.beginPath();
    ctx.arc(centerX, centerY, outerRadius + 30, 0, Math.PI * 2);
    ctx.fill();

    // 2. 中心から外側へのレーンガイド線（うっすら点線）
    ctx.strokeStyle = "#e8dfd1";
    ctx.lineWidth = 2;
    ctx.setLineDash([4, 8]);
    for (let angle of lanes) {
        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.lineTo(centerX + Math.cos(angle) * outerRadius, centerY + Math.sin(angle) * outerRadius);
        ctx.stroke();
    }
    ctx.setLineDash([]);

    // 3. 中心にいる女の子（歌っているイメージ）
    let girlFloatY = Math.sin(animTimer * 2) * 4;
    ctx.fillStyle = "#f5d0c5";
    ctx.beginPath();
    ctx.arc(centerX, centerY + girlFloatY + 10, 25, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#e6beae";
    ctx.beginPath();
    ctx.arc(centerX, centerY + girlFloatY - 10, 18, 0, Math.PI * 2);
    ctx.fill();

    // 4. 外側の丸い判定枠の描画
    for (let i = 0; i < lanes.length; i++) {
        let angle = lanes[i];
        let x = centerX + Math.cos(angle) * outerRadius;
        let y = centerY + Math.sin(angle) * outerRadius;

        // ヒット時のエフェクト処理
        let currentRadius = targetRadius;
        if (laneHitEffects[i] > 0) {
            laneHitEffects[i]--;
            ctx.fillStyle = "#ffe082"; // ヒット時に黄色く光る
            currentRadius += 6;
        } else {
            ctx.fillStyle = "rgba(255, 255, 255, 0.9)";
        }

        ctx.strokeStyle = "#d4c5b9";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(x, y, currentRadius, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
    }

    // 5. ノーツの移動と描画（中心から外側へ広がる）
    if (gameState === 'PLAYING') {
        let currentTime = audioCtx.currentTime - startTime;

        for (let note of notes) {
            if (note.hit) continue;

            let progress = (currentTime - (note.time - noteSpeed)) / noteSpeed;

            if (progress >= 0 && progress <= 1.2) {
                let angle = lanes[note.lane];
                // 中心から外側のターゲット位置へ向かって移動
                let x = centerX + Math.cos(angle) * (outerRadius * progress);
                let y = centerY + Math.sin(angle) * (outerRadius * progress);

                // 丸い可愛いノーツを描画
                ctx.fillStyle = "#e3c4a8";
                ctx.strokeStyle = "#ffffff";
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(x, y, 16, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
            }

            if (progress > 1.2 && !note.hit) {
                note.hit = true; // 叩かれずに外側に到達したらミス
            }
        }
    }

    // 6. 判定文字の表示
    if (feedbackTimer > 0) {
        feedbackTimer--;
        ctx.fillStyle = "#d4a373";
        ctx.font = "bold 24px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(feedbackText, centerX, centerY - 90);
    }

    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>

</body>
</html>
