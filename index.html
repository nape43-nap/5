<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>絵本風リズムゲーム</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #fdfbf7;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 450px;
            max-height: 800px;
            background: #fffdf9;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            border-radius: 20px;
            overflow: hidden;
            border: 8px solid #f0e6d2;
            -webkit-touch-callout: none;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        
        /* 共通画面スタイル */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(253, 251, 247, 0.98);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            padding: 20px;
            box-sizing: border-box;
        }
        .hidden {
            display: none !important;
        }
        h1 {
            color: #7c6f64;
            font-size: 24px;
            margin-bottom: 20px;
            text-align: center;
            letter-spacing: 1px;
        }
        .btn {
            background-color: #e3c4a8;
            color: #fff;
            border: none;
            padding: 14px 35px;
            font-size: 18px;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(227, 196, 168, 0.4);
            transition: 0.2s;
            margin-top: 25px;
        }
        .btn:active {
            transform: scale(0.95);
        }

        /* スワイプ・無限ループ対応の曲一覧セレクター */
        .song-selector-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }
        .song-list-viewport {
            width: 330px;
            height: 300px;
            overflow: hidden;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: grab;
            touch-action: none;
            mask-image: linear-gradient(to bottom, transparent, black 10%, black 90%, transparent);
            -webkit-mask-image: linear-gradient(to bottom, transparent, black 10%, black 90%, transparent);
        }
        .song-list-viewport:active {
            cursor: grabbing;
        }
        .song-card {
            position: absolute;
            width: 300px;
            background: #fff;
            border: 3px solid #f0e6d2;
            padding: 12px 15px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-sizing: border-box;
            box-shadow: 0 4px 10px rgba(0,0,0,0.02);
            pointer-events: none;
            transition: border-color 0.3s ease, background 0.3s ease;
        }
        .song-card.selected {
            border-color: #d4a373;
            background: #fffcf7;
            box-shadow: 0 6px 15px rgba(212, 163, 115, 0.15);
        }
        .song-jacket {
            width: 50px;
            height: 50px;
            border-radius: 10px;
            background: #f7f2ea;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            flex-shrink: 0;
            border: 2px solid #f0e6d2;
        }
        .song-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .song-title {
            font-weight: bold;
            color: #7c6f64;
            font-size: 15px;
        }
        .song-artist {
            font-size: 12px;
            color: #b8aea1;
        }

        /* 曲開始前クレジット画面 */
        #credit-screen {
            background: rgba(253, 251, 247, 0.99);
            text-align: center;
        }
        .credit-jacket-large {
            width: 130px;
            height: 130px;
            border-radius: 25px;
            background: #fff;
            border: 4px solid #f0e6d2;
            box-shadow: 0 8px 25px rgba(0,0,0,0.06);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 60px;
            margin-bottom: 20px;
            animation: pulseJacket 1.5s infinite alternate;
        }
        @keyframes pulseJacket {
            0% { transform: scale(1); }
            100% { transform: scale(1.04); }
        }
        .credit-title {
            font-size: 22px;
            font-weight: bold;
            color: #7c6f64;
            margin-bottom: 8px;
        }
        .credit-artist {
            font-size: 14px;
            color: #b8aea1;
            margin-bottom: 30px;
        }
        .ready-text {
            font-size: 18px;
            color: #d4a373;
            font-weight: bold;
            letter-spacing: 2px;
        }

        /* リザルト画面専用デザイン */
        .result-panel {
            background: #fff;
            border: 3px solid #f0e6d2;
            width: 100%;
            max-width: 330px;
            padding: 18px;
            border-radius: 20px;
            box-sizing: border-box;
            box-shadow: 0 4px 15px rgba(0,0,0,0.02);
            position: relative;
            margin-top: 10px;
        }
        .rank-badge {
            position: absolute;
            top: -20px;
            right: 20px;
            width: 55px;
            height: 55px;
            background: #e3c4a8;
            color: #fff;
            font-size: 30px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            box-shadow: 0 4px 10px rgba(227, 196, 168, 0.5);
            border: 3px solid #fff;
        }
        .result-song-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
            border-bottom: 2px dashed #f5efe6;
            padding-bottom: 12px;
        }
        .result-jacket-small {
            width: 45px;
            height: 45px;
            border-radius: 10px;
            background: #f7f2ea;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 22px;
            border: 2px solid #f0e6d2;
            flex-shrink: 0;
        }
        .result-song-meta {
            display: flex;
            flex-direction: column;
            gap: 3px;
            text-align: left;
        }
        .result-title-text {
            font-weight: bold;
            color: #7c6f64;
            font-size: 15px;
        }
        .result-artist-text {
            font-size: 11px;
            color: #b8aea1;
        }

        .result-score-container {
            text-align: center;
            margin-bottom: 12px;
            border-bottom: 2px dashed #f5efe6;
            padding-bottom: 10px;
        }
        .result-score-val {
            font-size: 32px;
            font-weight: bold;
            color: #d4a373;
        }
        .judge-stats {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 5px;
        }
        .judge-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            font-weight: bold;
            padding: 0 10px;
        }
        .stat-label-suteki { color: #e67e22; }
        .stat-label-kirari { color: #f1c40f; }
        .stat-label-ii { color: #3498db; }
        .stat-label-alara { color: #95a5a6; }
        .stat-value {
            color: #7c6f64;
            font-size: 15px;
        }

        #score-board {
            position: absolute;
            top: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            color: #7c6f64;
            font-size: 20px;
            font-weight: bold;
            pointer-events: none;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="score-board" class="hidden">スコア: 0</div>

    <!-- 1. 曲選択画面（上下スワイプ対応） -->
    <div id="select-screen" class="screen">
        <h1>MUSIC SELECT</h1>
        <div class="song-selector-container">
            <div class="song-list-viewport" id="song-viewport">
                <!-- JavaScriptでリストが動的に挿入されます -->
            </div>
        </div>
        <button class="btn" onclick="confirmSelectedSong()">決定</button>
    </div>

    <!-- 2. クレジット画面（3秒間の演出） -->
    <div id="credit-screen" class="screen hidden">
        <div class="credit-jacket-large" id="credit-jacket-icon">🏰</div>
        <div class="credit-title" id="credit-song-title">お城のメヌエット</div>
        <div class="credit-artist" id="credit-song-artist">Royal Orchestra</div>
        <div class="ready-text">READY...♪</div>
    </div>

    <!-- 3. リザルト画面 -->
    <div id="result-screen" class="screen hidden">
        <div class="result-panel">
            <div class="rank-badge" id="result-rank">S</div>
            
            <div class="result-song-header">
                <div class="result-jacket-small" id="result-jacket-icon">🏰</div>
                <div class="result-song-meta">
                    <div class="result-title-text" id="result-song-title">お城のメヌエット</div>
                    <div class="result-artist-text" id="result-song-artist">Royal Orchestra</div>
                </div>
            </div>

            <div class="result-score-container">
                <div style="font-size: 11px; color: #a89f91;">SCORE</div>
                <div class="result-score-val" id="final-score">0</div>
            </div>

            <div class="judge-stats">
                <div class="judge-row">
                    <span class="stat-label-kirari">ｷﾗﾘ!</span>
                    <span class="stat-value" id="count-kirari">0</span>
                </div>
                <div class="judge-row">
                    <span class="stat-label-suteki">ｽﾃｷ!</span>
                    <span class="stat-value" id="count-suteki">0</span>
                </div>
                <div class="judge-row">
                    <span class="stat-label-ii">ｲｲ!</span>
                    <span class="stat-value" id="count-ii">0</span>
                </div>
                <div class="judge-row">
                    <span class="stat-label-alara">ｱﾗﾗ</span>
                    <span class="stat-value" id="count-alara">0</span>
                </div>
            </div>
        </div>

        <button class="btn" onclick="backToSelect()">曲選択へ</button>
    </div>

    <canvas id="gameCanvas"></canvas>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
    canvas.width = canvas.parentElement.clientWidth;
    canvas.height = canvas.parentElement.clientHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

let gameState = 'SELECT';
let score = 0;
let audioCtx = null;
let startTime = 0;
let songDuration = 12.0; 

// 曲リスト
const songs = [
    { id: 'easy', title: 'お城のメヌエット', artist: 'Royal Orchestra', jacket: '🏰', duration: 12.0 },
    { id: 'normal', title: '星降る森の舞踏会', artist: 'Silky Night', jacket: '✨', duration: 12.5 },
    { id: 'extra', title: 'おひめさまのパレード', artist: 'Dreamy Kingdom', jacket: '🎠', duration: 13.0 }
];
let currentSongIndex = 0;

// スワイプ操作用の変数
let dragStartY = 0;
let dragCurrentOffset = 0;
let isDragging = false;
const itemHeight = 75;

let judgeCounts = {
    kirari: 0,
    suteki: 0,
    ii: 0,
    alara: 0
};

const targetRadius = 34; 
const noteSpeed = 2.8;   

// 曲選択画面のリスト描画
function renderSongSelector(animating = false) {
    const viewport = document.getElementById('song-viewport');
    viewport.innerHTML = '';

    for (let i = -2; i <= 2; i++) {
        let targetIdx = (currentSongIndex + i + songs.length * 10) % songs.length;
        let song = songs[targetIdx];

        let card = document.createElement('div');
        card.className = 'song-card';
        if (i === 0 && dragCurrentOffset === 0) card.classList.add('selected');

        let baseY = i * itemHeight;
        let totalY = baseY + dragCurrentOffset;

        let normY = totalY / itemHeight; 
        let scale = Math.max(0.75, 1 - Math.abs(normY) * 0.15);
        let opacity = Math.max(0.15, 1 - Math.abs(normY) * 0.35);
        let zIndex = 3 - Math.abs(i);

        if (animating) {
            card.style.transition = 'transform 0.25s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.25s ease';
        } else {
            card.style.transition = 'none';
        }

        card.style.transform = `translateY(${totalY}px) scale(${scale})`;
        card.style.opacity = opacity;
        card.style.zIndex = zIndex;

        card.innerHTML = `
            <div class="song-jacket">${song.jacket}</div>
            <div class="song-info">
                <div class="song-title">${song.title}</div>
                <div class="song-artist">${song.artist}</div>
            </div>
        `;

        viewport.appendChild(card);
    }
}

// スワイプイベントの登録（viewport要素に対して確実に紐付け）
const viewportEl = document.getElementById('song-viewport');

viewportEl.addEventListener('pointerdown', (e) => {
    if (gameState !== 'SELECT') return;
    isDragging = true;
    dragStartY = e.clientY;
    dragCurrentOffset = 0;
    renderSongSelector(false);
    viewportEl.setPointerCapture(e.pointerId);
});

viewportEl.addEventListener('pointermove', (e) => {
    if (!isDragging || gameState !== 'SELECT') return;
    let diffY = e.clientY - dragStartY;
    dragCurrentOffset = diffY;
    
    // 一定以上動いたらインデックスを切り替えてスムーズにループ
    while (Math.abs(dragCurrentOffset) >= itemHeight) {
        if (dragCurrentOffset > 0) {
            currentSongIndex = (currentSongIndex - 1 + songs.length) % songs.length;
            dragStartY += itemHeight;
            dragCurrentOffset -= itemHeight;
        } else {
            currentSongIndex = (currentSongIndex + 1) % songs.length;
            dragStartY -= itemHeight;
            dragCurrentOffset += itemHeight;
        }
    }
    
    renderSongSelector(false);
});

function handleDragEnd(e) {
    if (!isDragging || gameState !== 'SELECT') return;
    isDragging = false;
    
    let snapSteps = Math.round(dragCurrentOffset / itemHeight);
    currentSongIndex = (currentSongIndex - snapSteps + songs.length * 10) % songs.length;
    
    dragCurrentOffset = 0;
    renderSongSelector(true);
    
    try {
        viewportEl.releasePointerCapture(e.pointerId);
    } catch(err) {}
}

viewportEl.addEventListener('pointerup', handleDragEnd);
viewportEl.addEventListener('pointercancel', handleDragEnd);

// 初回描画
renderSongSelector(false);

function getLanePositions() {
    let positions = [];
    let centerX = canvas.width / 2;
    let baseY = canvas.height * 0.62; 
    let totalWidth = canvas.width * 0.78; 
    let spacing = totalWidth / 4;

    for (let i = 0; i < 5; i++) {
        let x = centerX - (totalWidth / 2) + (spacing * i);
        let offsetY = -Math.pow((i - 2), 2) * 14 + 30; 
        let y = baseY + offsetY;
        positions.push({ x: x, y: y });
    }
    return positions;
}

let notes = [];

function generateChart(type) {
    notes = [];
    let chartData = [];

    if (type === 'easy') {
        chartData = [
            { time: 1.5, lane: 0, type: 'tap' },
            { time: 3.0, lane: 4, type: 'tap' },
            { time: 4.5, lane: 2, type: 'long', duration: 1.5 },
            { time: 7.0, lane: 1, type: 'tap' },
            { time: 8.5, lane: 3, type: 'tap' },
            { time: 10.0, lane: 2, type: 'tap' }
        ];
    } else if (type === 'normal') {
        chartData = [
            { time: 1.0, lane: 0, type: 'tap' },
            { time: 1.6, lane: 4, type: 'tap' },
            { time: 2.2, lane: 1, lane2: 3, type: 'double' }, 
            { time: 3.0, lane: 1, type: 'long', duration: 2.0 }, 
            { time: 4.0, lane: 3, type: 'tap' },                
            { time: 6.0, lane: 0, type: 'tap' },
            { time: 6.0, lane: 4, type: 'tap' },
            { time: 7.5, lane: 2, type: 'long', duration: 1.5 },
            { time: 10.0, lane: 2, type: 'tap' }
        ];
    } else {
        chartData = [
            { time: 1.0, lane: 0, type: 'tap' },
            { time: 2.0, lane: 1, type: 'tap' },
            { time: 3.0, lane: 2, type: 'long', duration: 2.0 },
            { time: 6.0, lane: 3, type: 'tap' },
            { time: 7.0, lane: 4, type: 'tap' },
            { time: 9.0, lane: 0, lane2: 4, type: 'double' }
        ];
    }

    notes = chartData.map(n => ({
        ...n,
        hit: false,       
        holding: false,   
        started: false    
    }));
}

let animTimer = 0;
let laneHitEffects = [0, 0, 0, 0, 0];
let activeTouches = {}; 

let feedback = {
    text: "",
    color: "#f1c40f",
    timer: 0,
    maxTime: 25
};

function confirmSelectedSong() {
    let selectedSong = songs[currentSongIndex];
    songDuration = selectedSong.duration;

    document.getElementById('select-screen').classList.add('hidden');

    document.getElementById('credit-jacket-icon').innerText = selectedSong.jacket;
    document.getElementById('credit-song-title').innerText = selectedSong.title;
    document.getElementById('credit-song-artist').innerText = selectedSong.artist;

    document.getElementById('credit-screen').classList.remove('hidden');
    gameState = 'CREDIT';

    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    setTimeout(() => {
        startActualGame(selectedSong);
    }, 3000);
}

function startActualGame(song) {
    document.getElementById('credit-screen').classList.add('hidden');
    document.getElementById('score-board').classList.remove('hidden');
    
    score = 0;
    judgeCounts = { kirari: 0, suteki: 0, ii: 0, alara: 0 };
    scoreBoardUpdate();
    
    generateChart(song.id);
    startTime = audioCtx.currentTime;
    gameState = 'PLAYING';
}

function finishGame() {
    gameState = 'RESULT';
    document.getElementById('score-board').classList.add('hidden');
    
    let currentSong = songs[currentSongIndex];
    document.getElementById('result-jacket-icon').innerText = currentSong.jacket;
    document.getElementById('result-song-title').innerText = currentSong.title;
    document.getElementById('result-song-artist').innerText = currentSong.artist;

    document.getElementById('final-score').innerText = score;
    document.getElementById('count-kirari').innerText = judgeCounts.kirari;
    document.getElementById('count-suteki').innerText = judgeCounts.suteki;
    document.getElementById('count-ii').innerText = judgeCounts.ii;
    document.getElementById('count-alara').innerText = judgeCounts.alara;

    let rank = 'D';
    if (score >= 2500) rank = 'S';
    else if (score >= 2000) rank = 'A';
    else if (score >= 1400) rank = 'B';
    else if (score >= 800) rank = 'C';
    document.getElementById('result-rank').innerText = rank;

    document.getElementById('result-screen').classList.remove('hidden');
}

function backToSelect() {
    document.getElementById('result-screen').classList.add('hidden');
    document.getElementById('select-screen').classList.remove('hidden');
    gameState = 'SELECT';
    renderSongSelector(false);
}

function handleLaneStart(laneIndex) {
    if (gameState !== 'PLAYING') return;
    
    let currentTime = audioCtx.currentTime - startTime;
    let closestNote = null;
    let minDiff = 999;

    for (let note of notes) {
        if (!note.hit && !note.started) {
            let targetLanes = [note.lane];
            if (note.type === 'double' && note.lane2 !== undefined) {
                targetLanes.push(note.lane2);
            }

            if (targetLanes.includes(laneIndex)) {
                let diff = Math.abs(currentTime - note.time);
                if (diff < minDiff) {
                    minDiff = diff;
                    closestNote = note;
                }
            }
        }
    }

    if (closestNote && minDiff < 0.35) {
        if (closestNote.type === 'long') {
            closestNote.started = true;
            closestNote.holding = true;
            laneHitEffects[laneIndex] = 999; 
            score += 100;
            scoreBoardUpdate();
            playHitSound();
        } else {
            closestNote.hit = true;
            if (minDiff < 0.12) {
                score += 300;
                judgeCounts.suteki++;
                showFeedback("ｽﾃｷ!", "#e67e22");
            } else {
                score += 100;
                judgeCounts.ii++;
                showFeedback("ｲｲ!", "#3498db");
            }
            laneHitEffects[laneIndex] = 15;
            scoreBoardUpdate();
            playHitSound();
        }
    }
}

function handleLaneEnd(laneIndex) {
    for (let note of notes) {
        if (note.type === 'long' && note.holding) {
            let targetLanes = [note.lane];
            if (note.lane2 !== undefined) targetLanes.push(note.lane2);

            if (targetLanes.includes(laneIndex)) {
                let currentTime = audioCtx.currentTime - startTime;
                let endTime = note.time + note.duration;
                let diff = Math.abs(currentTime - endTime);

                if (diff < 0.3) {
                    score += 400;
                    judgeCounts.kirari++;
                    showFeedback("ｷﾗﾘ!", "#f1c40f");
                } else {
                    score += 100;
                    judgeCounts.ii++;
                    showFeedback("ｲｲ!", "#3498db");
                }

                note.hit = true;
                note.holding = false;
                laneHitEffects[laneIndex] = 0;
                scoreBoardUpdate();
            }
        }
    }
}

function scoreBoardUpdate() {
    document.getElementById('score-board').innerText = `スコア: ${score}`;
}

window.addEventListener('pointerdown', (e) => {
    if(e.target.tagName === 'BUTTON' || e.target.closest('.song-list-viewport')) return;
    if(gameState !== 'PLAYING') return;

    const rect = canvas.getBoundingClientRect();
    const touchX = e.clientX - rect.left;
    const touchY = e.clientY - rect.top;

    let lanes = getLanePositions();
    for (let i = 0; i < lanes.length; i++) {
        let distance = Math.hypot(touchX - lanes[i].x, touchY - lanes[i].y);
        if (distance < targetRadius * 1.8) {
            activeTouches[e.pointerId] = i;
            handleLaneStart(i);
            break;
        }
    }
});

window.addEventListener('pointerup', (e) => {
    if (activeTouches[e.pointerId] !== undefined) {
        let laneIndex = activeTouches[e.pointerId];
        handleLaneEnd(laneIndex);
        delete activeTouches[e.pointerId];
        
        let stillHeld = Object.values(activeTouches).includes(laneIndex);
        if (!stillHeld) {
            laneHitEffects[laneIndex] = 0;
        }
    }
});

window.addEventListener('pointercancel', (e) => {
    if (activeTouches[e.pointerId] !== undefined) {
        let laneIndex = activeTouches[e.pointerId];
        handleLaneEnd(laneIndex);
        delete activeTouches[e.pointerId];
        
        let stillHeld = Object.values(activeTouches).includes(laneIndex);
        if (!stillHeld) {
            laneHitEffects[laneIndex] = 0;
        }
    }
});

window.addEventListener('contextmenu', (e) => {
    e.preventDefault();
});

function playHitSound() {
    if (!audioCtx) return;
    let osc = audioCtx.createOscillator();
    let gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.1);
}

function showFeedback(text, color) {
    feedback.text = text;
    feedback.color = color;
    feedback.timer = feedback.maxTime;
}

function gameLoop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    animTimer += 0.05;

    let centerX = canvas.width / 2;
    let girlY = canvas.height * 0.3; 
    let lanes = getLanePositions();

    if (gameState === 'PLAYING') {
        let currentTime = audioCtx.currentTime - startTime;

        if (currentTime >= songDuration) {
            finishGame();
        }

        let girlFloatY = Math.sin(animTimer * 2) * 4;
        ctx.fillStyle = "#f5d0c5";
        ctx.beginPath();
        ctx.arc(centerX, girlY + girlFloatY + 15, 45, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "#e8dfd1";
        ctx.lineWidth = 4;
        ctx.stroke();

        ctx.fillStyle = "#e6beae";
        ctx.beginPath();
        ctx.arc(centerX, girlY + girlFloatY - 15, 30, 0, Math.PI * 2);
        ctx.fill();

        for (let i = 0; i < lanes.length; i++) {
            let x = lanes[i].x;
            let y = lanes[i].y;

            let currentRadius = targetRadius;
            if (laneHitEffects[i] > 0) {
                if (laneHitEffects[i] !== 999) laneHitEffects[i]--;
                ctx.fillStyle = "#ffe082";
                currentRadius += 6;
            } else {
                ctx.fillStyle = "rgba(255, 255, 255, 0.9)";
            }

            ctx.strokeStyle = "#d4c5b9";
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(x, y, currentRadius, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
        }

        for (let note of notes) {
            if (note.hit) continue;

            let targetLanes = [note.lane];
            let isDouble = (note.type === 'double' && note.lane2 !== undefined);
            if (isDouble) targetLanes.push(note.lane2);

            for (let lIdx of targetLanes) {
                let target = lanes[lIdx];

                if (note.type === 'long') {
                    let endTime = note.time + note.duration;

                    if (note.holding) {
                        if (currentTime <= endTime) {
                            ctx.fillStyle = "rgba(241, 196, 15, 0.7)";
                            ctx.beginPath();
                            ctx.arc(target.x, target.y, targetRadius + 6, 0, Math.PI * 2);
                            ctx.fill();

                            if (Math.random() < 0.25) {
                                score += 5;
                                scoreBoardUpdate();
                            }

                            let endProgress = (currentTime - (endTime - noteSpeed)) / noteSpeed;
                            if (endProgress < 1.0) {
                                let tailX = centerX + (target.x - centerX) * endProgress;
                                let tailY = girlY + (target.y - girlY) * endProgress;

                                ctx.strokeStyle = "rgba(243, 156, 18, 0.65)";
                                ctx.lineWidth = 14;
                                ctx.lineCap = "round";
                                ctx.beginPath();
                                ctx.moveTo(target.x, target.y);
                                ctx.lineTo(tailX, tailY);
                                ctx.stroke();

                                ctx.fillStyle = "#f39c12";
                                ctx.strokeStyle = "#ffffff";
                                ctx.lineWidth = 2;
                                ctx.beginPath();
                                ctx.arc(tailX, tailY, 12, 0, Math.PI * 2);
                                ctx.fill();
                                ctx.stroke();
                            }
                        } else {
                            note.hit = true;
                            note.holding = false;
                            
                            let stillHeld = Object.values(activeTouches).includes(lIdx);
                            if (!stillHeld) laneHitEffects[lIdx] = 0;
                        }
                        continue;
                    }

                    let progress = (currentTime - (note.time - noteSpeed)) / noteSpeed;
                    let endProgress = (currentTime - (endTime - noteSpeed)) / noteSpeed;

                    if (progress <= 1.2 && endProgress >= -0.2) {
                        let headX = centerX + (target.x - centerX) * progress;
                        let headY = girlY + (target.y - girlY) * progress;
                        let tailX = centerX + (target.x - centerX) * endProgress;
                        let tailY = girlY + (target.y - girlY) * endProgress;

                        ctx.strokeStyle = "rgba(243, 156, 18, 0.65)";
                        ctx.lineWidth = 14;
                        ctx.lineCap = "round";
                        ctx.beginPath();
                        ctx.moveTo(tailX, tailY);
                        ctx.lineTo(headX, headY);
                        ctx.stroke();

                        if (endProgress <= 1.0) {
                            ctx.fillStyle = "#f39c12";
                            ctx.strokeStyle = "#ffffff";
                            ctx.lineWidth = 2;
                            ctx.beginPath();
                            ctx.arc(tailX, tailY, 12, 0, Math.PI * 2);
                            ctx.fill();
                            ctx.stroke();
                        }

                        if (!note.started && progress <= 1.0) {
                            ctx.fillStyle = "#f39c12";
                            ctx.strokeStyle = "#ffffff";
                            ctx.lineWidth = 3;
                            ctx.beginPath();
                            ctx.arc(headX, headY, 16, 0, Math.PI * 2);
                            ctx.fill();
                            ctx.stroke();
                        }
                    }

                    if (progress > 1.2 && !note.started) {
                        note.hit = true;
                        judgeCounts.alara++;
                        showFeedback("ｱﾗﾗ", "#95a5a6");
                    }

                } else {
                    let progress = (currentTime - (note.time - noteSpeed)) / noteSpeed;
                    if (progress >= 0 && progress <= 1.2) {
                        let x = centerX + (target.x - centerX) * progress;
                        let y = girlY + (target.y - girlY) * progress;

                        ctx.lineWidth = 3;
                        ctx.strokeStyle = "#ffffff";

                        if (isDouble) {
                            ctx.fillStyle = "#e91e63"; 
                        } else {
                            ctx.fillStyle = "#1abc9c"; 
                        }

                        ctx.beginPath();
                        ctx.arc(x, y, 16, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.stroke();
                    }

                    if (progress > 1.2 && !note.hit) {
                        note.hit = true;
                        judgeCounts.alara++;
                        showFeedback("ｱﾗﾗ", "#95a5a6");
                    }
                }
            }
        }
    }

    if (feedback.timer > 0) {
        feedback.timer--;
        let progressRate = 1 - (feedback.timer / feedback.maxTime);
        
        let floatY = -Math.sin(progressRate * Math.PI) * 25;
        let alpha = feedback.timer < 8 ? (feedback.timer / 8) : 1.0;
        let scale = progressRate < 0.2 ? (0.8 + progressRate * 1.0) : 1.0;

        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.translate(centerX, girlY - 65 + floatY);
        ctx.scale(scale, scale);

        ctx.fillStyle = feedback.color;
        ctx.font = "bold 24px sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        
        ctx.lineWidth = 4;
        ctx.strokeStyle = "#ffffff";
        ctx.strokeText(feedback.text, 0, 0);
        ctx.fillText(feedback.text, 0, 0);

        ctx.restore();
    }

    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
