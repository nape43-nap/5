        judgeCounts.suteki++;


        showFloatingText(
            "ｽﾃｷ!",
            "#e67e22",
            x,
            y - 40
        );

    } else {

        score +=
            100;

        judgeCounts.ii++;


        showFloatingText(
            "ｲｲ!",
            "#3498db",
            x,
            y - 40
        );
    }


    scoreBoardUpdate();
}


/* =========================================================
   入力
========================================================= */

canvas.addEventListener(
    "pointerdown",
    e => {

        if (
            gameState !==
            "PLAYING"
        ) return;


        const rect =
            canvas.getBoundingClientRect();


        const touchX =
            e.clientX -
            rect.left;


        const touchY =
            e.clientY -
            rect.top;


        const touchInfo = {

            id:
                e.pointerId,

            startX:
                touchX,

            startY:
                touchY,

            currentX:
                touchX,

            currentY:
                touchY,

            assignedNote:
                null
        };


        activeTouches.set(
            e.pointerId,
            touchInfo
        );


        canvas.setPointerCapture(
            e.pointerId
        );


        const lanes =
            getLanePositions();


        const currentTime =
            audioCtx.currentTime -
            startTime -
            totalPausedTime;


        for (
            let i = 0;
            i < lanes.length;
            i++
        ) {

            const distance =
                Math.hypot(

                    touchX -
                    lanes[i].x,

                    touchY -
                    lanes[i].y
                );


            if (
                distance <
                targetRadius *
                2.2
            ) {

                for (
                    let note of notes
                ) {

                    if (
                        note.hit ||
                        note.started
                    ) continue;


                    if (
                        note.lane !== i
                    ) continue;


                    const diff =
                        Math.abs(

                            currentTime -
                            note.time
                        );


                    if (
                        diff >=
                        0.4
                    ) continue;


                    /*
                        TAP
                    */

                    if (
                        note.type ===
                        "tap"
                    ) {

                        note.hit =
                            true;


                        judgeAction(
                            diff,
                            lanes[i].x,
                            lanes[i].y
                        );


                        spawnParticles(
                            lanes[i].x,
                            lanes[i].y,
                            "#1abc9c"
                        );


                        break;
                    }


                    /*
                        LONG
                    */

                    if (
                        note.type ===
                        "long"
                    ) {

                        note.started =
                            true;

                        note.holding =
                            true;

                        note.assignedTouchId =
                            e.pointerId;


                        touchInfo.assignedNote =
                            note;


                        score +=
                            100;


                        scoreBoardUpdate();


                        spawnParticles(
                            lanes[i].x,
                            lanes[i].y,
                            "#f39c12"
                        );


                        break;
                    }


                    /*
                        SLIDE
                    */

                    if (
                        note.type ===
                            "slidenode" ||

                        note.type ===
                            "slide"
                    ) {

                        note.started =
                            true;

                        note.holding =
                            true;

                        note.assignedTouchId =
                            e.pointerId;


                        touchInfo.assignedNote =
                            note;


                        spawnParticles(
                            lanes[i].x,
                            lanes[i].y,
                            "#e056fd"
                        );


                        break;
                    }
                }
            }
        }
    }
);


/* =========================================================
   pointermove
========================================================= */

canvas.addEventListener(
    "pointermove",
    e => {

        if (
            !activeTouches.has(
                e.pointerId
            )
        ) return;


        const rect =
            canvas.getBoundingClientRect();


        const touchX =
            e.clientX -
            rect.left;


        const touchY =
            e.clientY -
            rect.top;


        const touchInfo =
            activeTouches.get(
                e.pointerId
            );


        touchInfo.currentX =
            touchX;


        touchInfo.currentY =
            touchY;


        if (
            touchInfo.assignedNote &&
            touchInfo.assignedNote.holding
        ) {

            const note =
                touchInfo.assignedNote;


            if (
                note.type ===
                    "slidenode" ||

                note.type ===
                    "slide"
            ) {

                const lanes =
                    getLanePositions();


                const path =
                    note.path ||
                    [
                        note.lane
                    ];


                const endLane =
                    path[
                        path.length - 1
                    ];


                const target =
                    lanes[
                        endLane
                    ];


                if (
                    target &&
                    Math.hypot(

                        touchX -
                        target.x,

                        touchY -
                        target.y

                    ) <
                    targetRadius *
                    2.5
                ) {

                    note.hit =
                        true;


                    note.holding =
                        false;


                    touchInfo.assignedNote =
                        null;


                    score +=
                        300;


                    judgeCounts.kirari++;


                    showFloatingText(
                        "ｷﾗﾘ!",
                        "#f1c40f",
                        target.x,
                        target.y - 40
                    );


                    spawnParticles(
                        target.x,
                        target.y,
                        "#e056fd"
                    );


                    scoreBoardUpdate();
                }
            }
        }
    }
);


/* =========================================================
   タッチ終了
========================================================= */

canvas.addEventListener(
    "pointerup",
    handleTouchEndOrCancel
);


canvas.addEventListener(
    "pointercancel",
    handleTouchEndOrCancel
);


function handleTouchEndOrCancel(
    e
) {

    if (
        !activeTouches.has(
            e.pointerId
        )
    ) return;


    const touchInfo =
        activeTouches.get(
            e.pointerId
        );


    const currentTime =
        audioCtx.currentTime -
        startTime -
        totalPausedTime;


    const lanes =
        getLanePositions();


    if (
        touchInfo.assignedNote
    ) {

        const note =
            touchInfo.assignedNote;


        /*
            LONG終了
        */

        if (
            note.type ===
            "long" &&
            note.holding
        ) {

            const endTime =
                note.time +
                note.duration;


            const diff =
                Math.abs(

                    currentTime -
                    endTime
                );


            const lane =
                lanes[
                    note.lane
                ];


            if (
                diff < 0.12
            ) {

                score +=
                    400;

                judgeCounts.kirari++;


                showFloatingText(
                    "ｷﾗﾘ!",
                    "#f1c40f",
                    lane.x,
                    lane.y - 40
                );

            } else if (
                diff < 0.28
            ) {

                score +=
                    250;

                judgeCounts.suteki++;


                showFloatingText(
                    "ｽﾃｷ!",
                    "#e67e22",
                    lane.x,
                    lane.y - 40
                );

            } else {

                score +=
                    50;

                judgeCounts.alara++;


                showFloatingText(
                    "ｱﾗﾗ",
                    "#95a5a6",
                    lane.x,
                    lane.y - 40
                );
            }


            note.hit =
                true;


            note.holding =
                false;


            scoreBoardUpdate();
        }


        /*
            SLIDE終了
        */

        else if (
            (
                note.type ===
                    "slidenode" ||

                note.type ===
                    "slide"
            ) &&
            note.holding
        ) {

            const path =
                note.path ||
                [
                    note.lane
                ];


            const endLane =
                path[
                    path.length - 1
                ];


            const target =
                lanes[
                    endLane
                ];


            const distance =
                Math.hypot(

                    touchInfo.currentX -
                    target.x,

                    touchInfo.currentY -
                    target.y
                );


            if (
                distance <
                targetRadius *
                2.5
            ) {

                score +=
                    200;

                judgeCounts.suteki++;


                showFloatingText(
                    "ｽﾃｷ!",
                    "#e67e22",
                    target.x,
                    target.y - 40
                );

            } else {

                judgeCounts.alara++;


                showFloatingText(
                    "ｱﾗﾗ",
                    "#95a5a6",
                    target.x,
                    target.y - 40
                );
            }


            note.hit =
                true;


            note.holding =
                false;


            scoreBoardUpdate();
        }

    } else {

        /*
            FLICK
        */

        for (
            let note of notes
        ) {

            if (
                note.hit ||
                note.type !==
                "flick"
            ) continue;


            const diff =
                Math.abs(

                    currentTime -
                    note.time
                );


            if (
                diff < 0.4
            ) {

                const distance =
                    Math.hypot(

                        touchInfo.currentX -
                        touchInfo.startX,

                        touchInfo.currentY -
                        touchInfo.startY
                    );


                if (
                    distance > 15
                ) {

                    note.hit =
                        true;


                    score +=
                        350;


                    judgeCounts.kirari++;


                    const lane =
                        lanes[
                            note.lane
                        ];


                    showFloatingText(
                        "ｷﾗﾘ!",
                        "#f1c40f",
                        lane.x,
                        lane.y - 40
                    );


                    spawnParticles(
                        lane.x,
                        lane.y,
                        "#9b59b6"
                    );


                    scoreBoardUpdate();


                    break;
                }
            }
        }
    }


    try {

        canvas.releasePointerCapture(
            e.pointerId
        );

    } catch {}


    activeTouches.delete(
        e.pointerId
    );
}


/* =========================================================
   ゲームループ
========================================================= */

let animTimer =
    0;


function gameLoop() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    animTimer +=
        0.05;


    const centerX =
        canvas.width / 2;


    const girlY =
        canvas.height *
        0.3 -
        70;


    const lanes =
        getLanePositions();


    const spawnOffsetY =
        75;


    if (
        gameState ===
        "PLAYING"
    ) {

        const currentTime =
            audioCtx.currentTime -
            startTime -
            totalPausedTime;


        const effectiveNoteSpeed =
            baseNoteSpeed *
            noteSpeedMultiplier;


        /*
            譜面終了
        */

        if (
            currentTime >=
            songDuration
        ) {

            finishGame();


            requestAnimationFrame(
                gameLoop
            );


            return;
        }


        /*
            女の子
        */

        const girlFloatY =
            Math.sin(
                animTimer * 2
            ) * 4;


        const girlWidth =
            110;


        const girlHeight =
            110;


        if (
            girlImg.complete &&
            girlImg.naturalWidth !== 0
        ) {

            ctx.drawImage(

                girlImg,

                centerX -
                girlWidth / 2,

                girlY +
                girlFloatY -
                girlHeight / 2 +
                15,

                girlWidth,

                girlHeight
            );

        } else {

            ctx.fillStyle =
                "#f5d0c5";


            ctx.beginPath();


            ctx.arc(

                centerX,

                girlY +
                girlFloatY +
                15,

                45,

                0,
                Math.PI * 2
            );


            ctx.fill();
        }


        /*
            判定枠
        */

        for (
            let i = 0;
            i < lanes.length;
            i++
        ) {

            const x =
                lanes[i].x;


            const y =
                lanes[i].y;


            ctx.fillStyle =
                "rgba(255,255,255,0.9)";


            ctx.strokeStyle =
                "#d4c5b9";


            ctx.lineWidth =
                3;


            ctx.beginPath();


            ctx.arc(

                x,
                y,

                targetRadius,

                0,
                Math.PI * 2
            );


            ctx.fill();

            ctx.stroke();


            ctx.strokeStyle =
                "#e8dfd1";


            ctx.lineWidth =
                2;


            ctx.beginPath();


            ctx.arc(

                x,
                y,

                targetRadius *
                0.55,

                0,
                Math.PI * 2
            );


            ctx.stroke();
        }


        /*
            ノーツ
        */

        for (
            let note of notes
        ) {

            if (
                note.hit
            ) continue;


            const target =
                lanes[
                    note.lane
                ];


            if (
                !target
            ) continue;


            const travelTime =
                baseNoteSpeed /
                effectiveNoteSpeed;


            /*
                TAP
            */

            if (
                note.type ===
                "tap"
            ) {

                const progress =
                    (
                        currentTime -
                        (
                            note.time -
                            travelTime
                        )
                    ) /
                    travelTime;


                if (
                    progress >= 0 &&
                    progress <= 1.2
                ) {

                    const startX =
                        centerX;


                    const startY =
                        girlY +
                        spawnOffsetY;


                    const x =
                        startX +
                        (
                            target.x -
                            startX
                        ) *
                        progress;


                    const y =
                        startY +
                        (
                            target.y -
                            startY
                        ) *
                        progress;


                    ctx.fillStyle =
                        "#1abc9c";


                    ctx.strokeStyle =
                        "#ffffff";


                    ctx.lineWidth =
                        3;


                    ctx.beginPath();


                    ctx.arc(

                        x,
                        y,

                        16,

                        0,
                        Math.PI * 2
                    );


                    ctx.fill();

                    ctx.stroke();
                }


                if (
                    progress > 1.2 &&
                    !note.hit
                ) {

                    note.hit =
                        true;


                    judgeCounts.alara++;


                    showFloatingText(
                        "ｱﾗﾗ",
                        "#95a5a6",
                        target.x,
                        target.y - 40
                    );
                }
            }


            /*
                FLICK
            */

            else if (
                note.type ===
                "flick"
            ) {

                const progress =
                    (
                        currentTime -
                        (
                            note.time -
                            travelTime
                        )
                    ) /
                    travelTime;


                if (
                    progress >= 0 &&
                    progress <= 1.2
                ) {

                    const startX =
                        centerX;


                    const startY =
                        girlY +
                        spawnOffsetY;


                    const x =
                        startX +
                        (
                            target.x -
                            startX
                        ) *
                        progress;


                    const y =
                        startY +
                        (
                            target.y -
                            startY
                        ) *
                        progress;


                    ctx.fillStyle =
                        "#9b59b6";


                    ctx.strokeStyle =
                        "#ffffff";


                    ctx.lineWidth =
                        3;


                    ctx.beginPath();


                    ctx.arc(

                        x,
                        y,

                        16,

                        0,
                        Math.PI * 2
                    );


                    ctx.fill();

                    ctx.stroke();


                    ctx.fillStyle =
                        "#ffffff";


                    ctx.font =
                        "bold 13px sans-serif";


                    ctx.textAlign =
                        "center";


                    ctx.textBaseline =
                        "middle";


                    ctx.fillText(
                        "◆",
                        x,
                        y
                    );
                }


                if (
                    progress > 1.2 &&
                    !note.hit
                ) {

                    note.hit =
                        true;


                    judgeCounts.alara++;


                    showFloatingText(
                        "ｱﾗﾗ",
                        "#95a5a6",
                        target.x,
                        target.y - 40
                    );
                }
            }


            /*
                LONG
            */

            else if (
                note.type ===
                "long"
            ) {

                const endTime =
                    note.time +
                    note.duration;


                const headProg =
                    (
                        currentTime -
                        (
                            note.time -
                            travelTime
                        )
                    ) /
                    travelTime;


                const tailProg =
                    (
                        currentTime -
                        (
                            endTime -
                            travelTime
                        )
                    ) /
                    travelTime;


                if (
                    headProg >= 0 &&
                    tailProg <= 1.2
                ) {

                    const startX =
                        centerX;


                    const startY =
                        girlY +
                        spawnOffsetY;


                    let headX;
                    let headY;

                    let tailX;
                    let tailY;


                    if (
                        headProg >= 1 ||
                        note.started
                    ) {

                        headX =
                            target.x;

                        headY =
                            target.y;

                    } else {

                        const p =
                            Math.max(
                                0,
                                headProg
                            );


                        headX =
                            startX +
                            (
                                target.x -
                                startX
                            ) *
                            p;


                        headY =
                            startY +
                            (
                                target.y -
                                startY
                            ) *
                            p;
                    }


                    if (
                        tailProg >= 1
                    ) {

                        tailX =
                            target.x;

                        tailY =
                            target.y;

                    } else {

                        const p =
                            Math.max(
                                0,
                                tailProg
                            );


                        tailX =
                            startX +
                            (
                                target.x -
                                startX
                            ) *
                            p;


                        tailY =
                            startY +
                            (
                                target.y -
                                startY
                            ) *
                            p;
                    }


                    /*
                        ロング本体
                    */

                    ctx.strokeStyle =
                        "rgba(243,156,18,0.65)";


                    ctx.lineWidth =
                        12;


                    ctx.lineCap =
                        "round";


                    ctx.beginPath();


                    ctx.moveTo(
                        tailX,
                        tailY
                    );


                    ctx.lineTo(
                        headX,
                        headY
                    );


                    ctx.stroke();


                    /*
                        頭
                    */

                    ctx.fillStyle =
                        "#f39c12";


                    ctx.strokeStyle =
                        "#ffffff";


                    ctx.lineWidth =
                        3;


                    ctx.beginPath();


                    ctx.arc(

                        headX,
                        headY,

                        16,

                        0,
                        Math.PI * 2
                    );


                    ctx.fill();

                    ctx.stroke();


                    /*
                        終点
                    */

                    if (
                        tailProg >= 0 &&
                        currentTime <
                        endTime
                    ) {

                        ctx.beginPath();


                        ctx.arc(

                            tailX,
                            tailY,

                            15,

                            0,
                            Math.PI * 2
                        );


                        ctx.fill();

                        ctx.stroke();
                    }


                    /*
                        押している途中で
                        大幅に離した場合
                    */

                    if (
                        note.holding
                    ) {

                        if (
                            currentTime >=
                            endTime +
                            0.35 &&
                            !note.hit
                        ) {

                            note.hit =
                                true;


                            note.holding =
                                false;


                            judgeCounts.alara++;


                            showFloatingText(
                                "ｱﾗﾗ",
                                "#95a5a6",
                                target.x,
                                target.y - 40
                            );
                        }
                    }
                }
            }


            /*
                SLIDE
            */

            else if (
                note.type ===
                    "slidenode" ||

                note.type ===
                    "slide"
            ) {

                const path =
                    note.path ||
                    [
                        note.lane
                    ];


                const progress =
                    (
                        currentTime -
                        (
                            note.time -
                            travelTime
                        )
                    ) /
                    travelTime;


                if (
                    progress >= 0 &&
                    progress <= 1.5
                ) {

                    const startPos =
                        lanes[
                            path[0]
                        ];


                    const endPos =
                        lanes[
                            path[
                                path.length - 1
                            ]
                        ];


                    if (
                        !startPos ||
                        !endPos
                    ) continue;


                    const startSpawnX =
                        centerX;


                    const startSpawnY =
                        girlY +
                        spawnOffsetY;


                    const startX =
                        startSpawnX +
                        (
                            startPos.x -
                            startSpawnX
                        ) *
                        progress;


                    const startY =
                        startSpawnY +
                        (
                            startPos.y -
                            startSpawnY
                        ) *
                        progress;


                    const endX =
                        startSpawnX +
                        (
                            endPos.x -
                            startSpawnX
                        ) *
                        progress;


                    const endY =
                        startSpawnY +
                        (
                            endPos.y -
                            startSpawnY
                        ) *
                        progress;


                    ctx.strokeStyle =
                        "rgba(224,86,253,0.9)";


                    ctx.lineWidth =
                        14;


                    ctx.lineCap =
                        "round";


                    ctx.beginPath();


                    ctx.moveTo(
                        startX,
                        startY
                    );


                    ctx.lineTo(
                        endX,
                        endY
                    );


                    ctx.stroke();


                    ctx.fillStyle =
                        "#e056fd";


                    ctx.strokeStyle =
                        "#ffffff";


                    ctx.lineWidth =
                        3;


                    ctx.beginPath();


                    ctx.arc(

                        startX,
                        startY,

                        16,

                        0,
                        Math.PI * 2
                    );


                    ctx.fill();

                    ctx.stroke();


                    ctx.beginPath();


                    ctx.arc(

                        endX,
                        endY,

                        15,

                        0,
                        Math.PI * 2
                    );


                    ctx.fill();

                    ctx.stroke();


                    ctx.fillStyle =
                        "#ffffff";


                    ctx.font =
                        "bold 13px sans-serif";


                    ctx.textAlign =
                        "center";


                    ctx.textBaseline =
                        "middle";


                    ctx.fillText(

                        note.direction ===
                        "left"
                        ?
                        "◀︎"
                        :
                        "▶︎",

                        startX,
                        startY
                    );
                }


                if (
                    progress > 1.5 &&
                    !note.hit
                ) {

                    note.hit =
                        true;


                    judgeCounts.alara++;


                    const endPos =
                        lanes[
                            path[
                                path.length - 1
                            ]
                        ];


                    if (endPos) {

                        showFloatingText(
                            "ｱﾗﾗ",
                            "#95a5a6",
                            endPos.x,
                            endPos.y - 40
                        );
                    }
                }
            }
        }
    }


    /*
        パーティクル
    */

    for (
        let i =
            particles.length - 1;

        i >= 0;

        i--
    ) {

        const p =
            particles[i];


        p.x +=
            p.vx;

        p.y +=
            p.vy;


        p.alpha -=
            p.decay;


        if (
            p.alpha <= 0
        ) {

            particles.splice(
                i,
                1
            );

            continue;
        }


        ctx.save();


        ctx.globalAlpha =
            p.alpha;


        ctx.fillStyle =
            p.color;


        ctx.beginPath();


        ctx.arc(

            p.x,
            p.y,

            p.radius,

            0,
            Math.PI * 2
        );


        ctx.fill();


        ctx.restore();
    }


    /*
        判定文字
    */

    for (
        let i =
            floatingTexts.length - 1;

        i >= 0;

        i--
    ) {

        const ft =
            floatingTexts[i];


        ft.timer--;


        const progressRate =
            1 -
            ft.timer /
            ft.maxTime;


        const floatY =
            -Math.sin(
                progressRate *
                Math.PI
            ) *
            25;


        const alpha =
            ft.timer < 8
            ?
            ft.timer / 8
            :
            1;


        ctx.save();


        ctx.globalAlpha =
            alpha;


        ctx.translate(

            ft.x,

            ft.y +
            floatY
        );


        ctx.fillStyle =
            ft.color;


        ctx.font =
            "bold 22px 'RocknRoll One', sans-serif";


        ctx.textAlign =
            "center";


        ctx.textBaseline =
            "middle";


        ctx.lineWidth =
            4;


        ctx.strokeStyle =
            "#ffffff";


        ctx.strokeText(
            ft.text,
            0,
            0
        );


        ctx.fillText(
            ft.text,
            0,
            0
        );


        ctx.restore();


        if (
            ft.timer <= 0
        ) {

            floatingTexts.splice(
                i,
                1
            );
        }
    }


    requestAnimationFrame(
        gameLoop
    );
}


/* =========================================================
   その他
========================================================= */

window.addEventListener(
    "contextmenu",
    e => {

        e.preventDefault();
    }
);


/* =========================================================
   起動
========================================================= */

loadSongIndex();

gameLoop();

</script>
