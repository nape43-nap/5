<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, user-scalable=no"
>

<title>絵本風リズムゲーム</title>

<link
    href="https://fonts.googleapis.com/css2?family=Darumadrop+One&family=RocknRoll+One&display=swap"
    rel="stylesheet"
>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;
    padding: 0;

    background: #fdfbf7;

    font-family:
        'RocknRoll One',
        sans-serif;

    display: flex;

    justify-content: center;
    align-items: center;

    width: 100vw;
    height: 100vh;

    overflow: hidden;

    touch-action: none;

    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
}

.en-font {

    font-family:
        'Darumadrop One',
        cursive,
        sans-serif;
}

#game-container {

    position: relative;

    width: 100vw;
    height: 100vh;

    max-width: 450px;
    max-height: 800px;

    background: #fffdf9;

    box-shadow:
        0 10px 30px
        rgba(0,0,0,0.05);

    border-radius: 20px;

    overflow: hidden;

    border:
        8px solid
        #f0e6d2;
}

canvas {

    display: block;

    width: 100%;
    height: 100%;
}

.screen {

    position: absolute;

    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    background:
        rgba(253,251,247,0.98);

    display: flex;

    flex-direction: column;

    justify-content: center;
    align-items: center;

    z-index: 10;

    padding: 20px;
}

.hidden {

    display: none !important;
}

h1 {

    color: #7c6f64;

    font-size: 26px;

    margin-bottom: 20px;

    text-align: center;
}

.btn {

    background-color:
        #e3c4a8;

    color: #fff;

    border: none;

    padding: 14px 35px;

    font-size: 18px;

    border-radius: 30px;

    cursor: pointer;

    box-shadow:
        0 4px 15px
        rgba(227,196,168,0.4);

    margin-top: 15px;

    font-family:
        'RocknRoll One',
        sans-serif;
}

.btn:active {

    transform: scale(0.95);
}

#selector-config-btn,
#menu-btn {

    position: absolute;

    top: 15px;
    right: 15px;

    background: #fff;

    border:
        2.5px solid
        #f0e6d2;

    color: #7c6f64;

    width: 38px;
    height: 38px;

    border-radius: 50%;

    font-size: 16px;

    display: flex;

    justify-content: center;
    align-items: center;

    cursor: pointer;

    z-index: 25;
}

.song-selector-container {

    display: flex;

    flex-direction: column;

    align-items: center;

    position: relative;

    width: 100%;
}

.song-list-viewport {

    width: 330px;
    height: 280px;

    overflow: hidden;

    position: relative;

    display: flex;

    justify-content: center;
    align-items: center;

    cursor: grab;

    touch-action: none;

    mask-image:
        linear-gradient(
            to bottom,
            transparent,
            black 10%,
            black 90%,
            transparent
        );

    -webkit-mask-image:
        linear-gradient(
            to bottom,
            transparent,
            black 10%,
            black 90%,
            transparent
        );
}

.song-card {

    position: absolute;

    width: 300px;

    background: #fff;

    border:
        3px solid
        #f0e6d2;

    padding: 12px 15px;

    border-radius: 15px;

    display: flex;

    align-items: center;

    gap: 15px;

    box-shadow:
        0 4px 10px
        rgba(0,0,0,0.02);

    pointer-events: none;
}

.song-card.selected {

    border-color: #d4a373;

    background: #fffcf7;
}

.song-jacket {

    width: 50px;
    height: 50px;

    display: flex;

    justify-content: center;
    align-items: center;

    font-size: 24px;

}

.song-jacket img {

    width: 100%;
    height: 100%;

}

.song-info {

    flex-direction: column;

    gap: 4px;

    min-width: 0;
}

.song-title {

    font-weight: bold;

    color: #7c6f64;

    font-size: 15px;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}

.song-artist {

    font-size: 12px;

}

.song-difficulty {

    font-size: 10px;

    color: #d4a373;
}

.cloud-highscore {

.cloud-rank-box {

.cloud-info {

}

.cloud-label {

.cloud-score-val {

.credit-jacket-large {

.setting-range-container {

.result-song-header {

.result-jacket-small {

.result-song-meta {

.result-score-container {

<script>

/* =========================================================
   Canvas
========================================================= */

const canvas =
    document.getElementById(
        "gameCanvas"
    );

const ctx =
    canvas.getContext("2d");


function resizeCanvas() {

    canvas.width =
        canvas.parentElement.clientWidth;

    canvas.height =
        canvas.parentElement.clientHeight;
}


window.addEventListener(
    "resize",
    resizeCanvas
);

resizeCanvas();


/* =========================================================
   女の子
========================================================= */

const girlImg =
    new Image();

girlImg.src =
    "girl.png";


/* =========================================================
   ゲーム状態
========================================================= */

let gameState =
    "SELECT";

let score =
    0;

let combo =
    0;

let audioCtx =
    null;

let musicAudio =
    null;

let startTime =
    0;

let totalPausedTime =
    0;

let pauseStartTime =
    0;

let songDuration =
    15;

let chartEndTime =
    0;


/* =========================================================
   ノーツ速度
========================================================= */

let noteSpeedMultiplier =
    parseFloat(
        localStorage.getItem(
            "rhythm_game_speed"
        )
    ) || 1.0;


const baseNoteSpeed =
    2.8;


const targetRadius = 36;


/* =========================================================
   曲データ
========================================================= */

let songs = [];

let currentSongIndex = 0;

let currentSong = null;


/* =========================================================
   index.json読み込み
========================================================= */

async function loadSongIndex() {

    try {

        const response =
            await fetch(
                "songs/index.json?t=" +
                Date.now()
            );


        if (!response.ok) {

            throw new Error(
                "songs/index.json HTTP " +
                response.status
            );
        }


        const data =
            await response.json();


        if (
            !data.songs ||
            !Array.isArray(data.songs)
        ) {

            throw new Error(
                "index.json の songs が配列ではありません"
            );
        }


        songs =
            data.songs.map(
                item => {

                    /*
                        文字列形式
                    */

                    if (
                        typeof item === "string"
                    ) {

                        return {

                            id: item,

                            title: item,

                            artist: "",

                            jacket: "🎵",

                            audioSrc:
                                "songs/" +
                                item +
                                "/audio.mp3",

                            chartFile:
                                "songs/" +
                                item +
                                "/chart.js",

                            difficulty: "",

                            level: ""
                        };
                    }


                    /*
                        オブジェクト形式
                    */

                    const id =
                        item.id ||
                        item.name;


                    return {

                        id: id,

                        title:
                            item.title ||
                            id,

                        artist:
                            item.artist ||
                            "",

                        jacket:
                            item.jacket ||
                            "🎵",

                        audioSrc:
                            item.audio ||
                            item.audioSrc ||
                            (
                                "songs/" +
                                id +
                                "/audio.mp3"
                            ),

                        chartFile:
                            item.chart ||
                            item.chartFile ||
                            (
                                "songs/" +
                                id +
                                "/chart.js"
                            ),

                        difficulty:
                            item.difficulty ||
                            "",

                        level:
                            item.level ??
                            "",

                        difficulties:
                            item.difficulties ||
                            null
                    };
                }
            );


        console.log(
            "================================"
        );

        console.log(
            "曲一覧読み込み成功"
        );

        console.log(
            songs
        );

        console.log(
            "================================"
        );


        if (
            songs.length === 0
        ) {

            throw new Error(
                "曲が1曲もありません"
            );
        }


        await loadSongInfoForSelector();


    } catch (error) {

        console.error(
            "曲一覧読み込みエラー:",
            error
        );


        alert(
            "曲一覧を読み込めませんでした。\n\n" +
            error.message
        );
    }
}


/* =========================================================
   外部JS譜面読み込み
   完全版・安定版

   songs/
   └─ sample/
      └─ chart.js

   の形式に対応
========================================================= */

/* =========================================================
   外部JS譜面読み込み
   完全版
========================================================= */

async function loadExternalChart(song) {

    if (
        !song ||
        !song.id
    ) {

        throw new Error(
            "曲情報がありません。"
        );
    }


    /*
        譜面ファイル

        sample
        ↓
        songs/sample/chart.js
    */

    const chartFile =
        song.chartFile ||
        `songs/${song.id}/chart.js`;


    const chartURL =
        new URL(
            chartFile,
            window.location.href
        ).href;


    console.log(
        "================================"
    );

    console.log(
        "譜面読み込み開始"
    );

    console.log(
        "曲ID:",
        song.id
    );

    console.log(
        "URL:",
        chartURL
    );

    console.log(
        "================================"
    );


    /*
        =====================================================
        chart.jsを取得
        =====================================================
    */

    let response;

    try {

        response =
            await fetch(
                chartURL +
                "?t=" +
                Date.now(),
                {
                    cache: "no-store"
                }
            );

    } catch (
        error
    ) {

        console.error(
            "chart.js fetchエラー:",
            error
        );

        throw new Error(
            "chart.jsにアクセスできませんでした。\n\n" +
            chartURL
        );
    }


    /*
        HTTPエラー
    */

    if (
        !response.ok
    ) {

        throw new Error(
            "chart.jsを読み込めませんでした。\n\n" +
            "HTTP Status: " +
            response.status +
            "\n\n" +
            chartURL
        );
    }


    /*
        =====================================================
        JavaScriptとして読み込む
        =====================================================
    */

    const scriptText =
        await response.text();


    console.log(
        "chart.js取得成功"
    );

    console.log(
        "文字数:",
        scriptText.length
    );


    /*
        古いデータを削除
    */

    window.chart =
        null;

    window.sample =
        null;


    const songDataName =
        "songData_" +
        song.id;


    window[
        songDataName
    ] =
        null;


    /*
        =====================================================
        chart.jsを実行
        =====================================================
    */

    try {

        const runChart =
            new Function(
                scriptText
            );


        runChart();

    } catch (
        error
    ) {

        console.error(
            "chart.js実行エラー:",
            error
        );


        throw new Error(
            "chart.jsの中でエラーが発生しました。\n\n" +
            error.message
        );
    }


    /*
        =====================================================
        songData_xxx取得
        =====================================================
    */

    const songData =
        window[
            songDataName
        ];


    if (
        songData
    ) {

        console.log(
            "================================"
        );

        console.log(
            "★★★★★ 譜面読み込み成功 ★★★★★"
        );

        console.log(
            "データ:",
            songData
        );

        console.log(
            "譜面数:",
            Array.isArray(
                songData.chart
            )
            ?
            songData.chart.length
            :
            0
        );

        console.log(
            "================================"
        );


        /*
            曲情報を反映
        */

        if (
            songData.audioSrc
        ) {

            song.audioSrc =
                songData.audioSrc;
        }


        if (
            songData.duration
        ) {

            song.chartDuration =
                Number(
                    songData.duration
                );
        }


        if (
            songData.jacket
        ) {

            song.jacket =
                songData.jacket;
        }


        if (
            songData.title
        ) {

            song.title =
                songData.title;
        }


        if (
            songData.artist
        ) {

            song.artist =
                songData.artist;
        }


        return songData;
    }


    /*
        =====================================================
        旧形式にも対応
        =====================================================
    */

    if (
        window.chart
    ) {

        console.log(

        return window.chart;
    }


    if (
        window.sample

/* =========================================================
   譜面終了時間
========================================================= */

function calculateChartEndTime(
    chart
) {

    if (
        !chart ||
        chart.length === 0
    ) {

        return 5;
    }


    let maxTime =
        0;


    for (
        const note of chart
    ) {

        let endTime =
            Number(
                note.time
            ) || 0;


        /*
            LONG
        */

        if (
            note.type ===
            "long"
        ) {

            endTime +=
                Number(
                    note.duration
                ) || 0;
        }


        /*
            SLIDE
        */

        if (
            note.type ===
                "slidenode" ||

            note.type ===
                "slide"
        ) {

            endTime +=
                Number(
                    note.slideDuration ||
                    note.pathTime ||
                    note.duration ||
                    0
                );
        }


        if (
            endTime >
            maxTime
        ) {

            maxTime =
                endTime;
        }
    }


    return (
        maxTime +
        1.5
    );
}


/* =========================================================
   譜面生成
========================================================= */

function generateChart(
    chartData
) {

    notes = [];

    particles = [];

    floatingTexts = [];


    if (
        !Array.isArray(
            chartData
        )
    ) {

        console.error(
            "chartDataが配列ではありません:",
            chartData
        );

        chartData = [];
    }


    notes =
        chartData.map(
            note => {

                let normalizedType =
                    note.type ||
                    "tap";


                /*
                    slide → slidenode
                */

                if (
                    normalizedType ===
                    "slide"
                ) {

                    normalizedType =
                        "slidenode";
                }


                return {

                    ...note,

                    time:
                        Number(
                            note.time
                        ) || 0,

                    lane:
                        Number(
                            note.lane
                        ) || 0,

                    type:
                        normalizedType,

                    duration:
                        Number(
                            note.duration
                        ) || 0,

                    hit:
                        false,

                    holding:
                        false,

                    started:
                        false,

                    assignedTouchId:
                        null
                };
            }
        );


    chartEndTime =
        calculateChartEndTime(
            notes
        );


    songDuration =
        chartEndTime;


    /*
        chart.js側にdurationがあれば
        そちらも考慮
    */

    if (
        currentSong &&
        currentSong.chartDuration
    ) {

        songDuration =
            Math.max(
                songDuration,
                currentSong.chartDuration
            );
    }


    console.log(
        "================================"
    );

    console.log(
        "譜面生成成功"
    );

    console.log(
        "ノーツ数:",
        notes.length
    );

    console.log(
        "譜面終了時間:",
        songDuration
    );

    console.log(
        notes
    );

    console.log(
        "================================"
    );
}


/* =========================================================
   扇型レイアウト

   ・女の子は画面の上のほうに立っています
   ・ノーツは女の子の足元から扇のように広がって降りてきます
   ・判定は、下の弧の上に並んだ5か所です
     （左・斜め左・中央・斜め右・右）
========================================================= */

const FAN = {

    /* 奥行きの深さ（大きいほど出だしが小さく見える） */
    zFar: 2.5,

    /* ノーツが出現する時の大きさ */
    s0: 0.4,

    /* 5つの判定位置の角度（真下が0度） */
    angles: [-56, -30, 0, 30, 56]
};


/* 今のフレームの形（毎フレーム更新） */
let HW = null;


function getHighwayGeometry() {

    const w = canvas.width;
    const h = canvas.height;

    /* 画面が小さい端末ではノーツも少し小さく */
    const k =
        Math.max(0.7, Math.min(1.2, w / 434));

    const cx = w / 2;

    /* 判定の弧（楕円の下半分） */
    const Rx = w * 0.40;
    const Ry = h * 0.30;
    const cyE = h * 0.50;

    /* ノーツの出どころ（女の子の足元） */
    const O = {
        x: cx,
        y: h * 0.28
    };

    const pts = [];
    const rots = [];

    for (const a of FAN.angles) {

        const r = a * Math.PI / 180;

        const p = {
            x: cx + Rx * Math.sin(r),
            y: cyE + Ry * Math.cos(r)
        };

        pts.push(p);

        /* ノーツの向き（進行方向に対して横長にする） */
        rots.push(
            Math.atan2(p.y - O.y, p.x - O.x) -
            Math.PI / 2
        );
    }

    return {

        w: w,
        h: h,
        cx: cx,
        Rx: Rx,
        Ry: Ry,
        cyE: cyE,
        O: O,
        pts: pts,
        rots: rots,
        s0: FAN.s0,
        noteW: 64 * k,
        noteH: 64 * k
    };
}


/* 弧の上の点（kは弧の大きさの倍率） */
function ellipsePt(g, aDeg, k) {

    const r = aDeg * Math.PI / 180;

    return {
        x: g.cx + g.Rx * k * Math.sin(r),
        y: g.cyE + g.Ry * k * Math.cos(r)
    };
}


/* progress(0〜1)から大きさ(0.25〜1)を求める */
function depthScale(p) {

    if (p < 0) p = 0;

    if (p <= 1) {

        const z =
            FAN.zFar -
            (FAN.zFar - 1) * p;

        return 1 / z;
    }

    /* 判定を過ぎたあと */
    return 1 + (p - 1);
}


/* ノーツの今の位置・大きさ・向き */
function fanPos(g, laneFloat, p) {

    const s = depthScale(p);

    const q = (s - g.s0) / (1 - g.s0);

    const l = Math.max(0, Math.min(4, laneFloat));

    const i0 = Math.floor(l);
    const i1 = Math.min(4, i0 + 1);
    const f = l - i0;

    const P = {
        x: g.pts[i0].x + (g.pts[i1].x - g.pts[i0].x) * f,
        y: g.pts[i0].y + (g.pts[i1].y - g.pts[i0].y) * f
    };

    const rot =
        g.rots[i0] + (g.rots[i1] - g.rots[i0]) * f;

    return {

        x: g.O.x + (P.x - g.O.x) * q,
        y: g.O.y + (P.y - g.O.y) * q,
        s: s,
        rot: rot
    };
}


/* 5つの判定位置（タップ判定に使われる） */
function getLanePositions() {

    const g = getHighwayGeometry();

    return g.pts.map(
        p => ({ x: p.x, y: p.y })
    );
}


/* =========================================================
   ハイスコア
========================================================= */

function getSongHighScore(
    id
) {

    const saved =
        localStorage.getItem(
            "rhythm_game_hs_" +
            id
        );


    return saved
        ? JSON.parse(saved)
        : {

            score: 0,

            accuracy: 0,

            rank: "-"
        };
}


function saveSongHighScore(
    id,
    newScore,
    accuracy,
    rank
) {

    const current =
        getSongHighScore(
            id
        );


    if (
        accuracy >
        current.accuracy ||

        (
            accuracy ===
            current.accuracy &&

            newScore >=
            current.score
        )
    ) {

        localStorage.setItem(

            "rhythm_game_hs_" +
            id,

            JSON.stringify({

                score:
                    newScore,

                accuracy:
                    accuracy,

                rank:
                    rank
            })
        );
    }
}

let dragStartY =
    0;

let dragCurrentOffset =
    0;

let isDragging =
    false;

const itemHeight =
    75;


function updateSelectorHighScoreDisplay() {

    if (
        !songs.length
    ) return;


    const song =
        songs[
            currentSongIndex
        ];


    if (!song) return;


    const hs =

}


function createJacketHTML(
    jacket
) {

    if (
        typeof jacket ===
        "string" &&

        (
            jacket.endsWith(
                ".png"
            ) ||

            jacket.endsWith(
                ".jpg"
            ) ||

            jacket.endsWith(
                ".jpeg"
            ) ||

            jacket.endsWith(
                ".webp"
            )
        )
    ) {

        return `
            <img
                src="${jacket}"
                onerror="
                    this.style.display='none';
                    this.parentElement.innerText='🎵';
                "
            >
        `;
    }


    return jacket || "🎵";
}


function renderSongSelector() {

    const viewport =
        document.getElementById(
            "song-viewport"
        );


    if (!viewport) return;


    viewport.innerHTML =
        "";


    if (
        songs.length === 0
    ) {

        return;
    }


    for (
        let i = -2;
        i <= 2;
        i++
    ) {

        const targetIdx =
            (
                currentSongIndex +
                i +
                songs.length * 10
            ) %
            songs.length;


        const song =
            songs[
                targetIdx
            ];


        const card =
            document.createElement(
                "div"
            );


        card.className =
            "song-card";


        if (
            i === 0 &&
            dragCurrentOffset === 0
        ) {

            card.classList.add(
                "selected"
            );
        }


        const totalY =
            i *
            itemHeight +
            dragCurrentOffset;


        const normY =
            totalY /
            itemHeight;


        const scale =
            Math.max(
                0.75,
                1 -
                Math.abs(
                    normY
                ) *
                0.15
            );


        const opacity =
            Math.max(
                0.15,
                1 -
                Math.abs(
                    normY
                ) *
                0.35
            );


        card.style.transform =
            `translateY(${totalY}px) scale(${scale})`;


        card.style.opacity =
            opacity;


        card.style.zIndex =
            3 -
            Math.abs(i);


        let difficultyText =
            "";


        if (
            song.difficulty
        ) {

            difficultyText =
                song.difficulty +
                (
                    song.level !== "" &&
                    song.level !== null
                    ?
                    " ★" +
                    song.level
                    :
                    ""
                );
        }


        card.innerHTML = `

            <div class="song-jacket">
                ${
                    createJacketHTML(
                        song.jacket
                    )
                }
            </div>

            <div class="song-info">

                <div class="song-title">
                    ${
                        song.title ||
                        song.id
                    }
                </div>

                <div class="song-artist">
                    ${
                        song.artist ||
                        ""
                    }
                </div>

                ${
                    difficultyText
                    ?
                    `
                    <div class="song-difficulty">
                        ${difficultyText}
                    </div>
                    `
                    :
                    ""
                }

            </div>
        `;


        viewport.appendChild(
            card
        );
    }


    updateSelectorHighScoreDisplay();
}


const viewportEl =
    document.getElementById(
        "song-viewport"
    );


viewportEl.addEventListener(
    "pointerdown",
    e => {

        if (
            gameState !==
            "SELECT"
        ) return;


        isDragging =
            true;


        dragStartY =
            e.clientY;


        dragCurrentOffset =
            0;


        viewportEl.setPointerCapture(
            e.pointerId
        );
    }
);


viewportEl.addEventListener(
    "pointermove",
    e => {

        if (
            !isDragging ||
            gameState !==
            "SELECT"
        ) return;


        let diffY =
            e.clientY -
            dragStartY;


        dragCurrentOffset =
            diffY;


        while (
            Math.abs(
                dragCurrentOffset
            ) >= itemHeight
        ) {

            if (
                dragCurrentOffset >
                0
            ) {

                currentSongIndex =
                    (
                        currentSongIndex -
                        1 +
                        songs.length
                    ) %
                    songs.length;


                dragStartY +=
                    itemHeight;


                dragCurrentOffset -=
                    itemHeight;

            } else {

                currentSongIndex =
                    (
                        currentSongIndex +
                        1
                    ) %
                    songs.length;


                dragStartY -=
                    itemHeight;


                dragCurrentOffset +=
                    itemHeight;
            }
        }


        renderSongSelector();
    }
);


function handleDragEnd(e) {

    if (
        !isDragging
    ) return;


    isDragging =
        false;


    const snapSteps =
        Math.round(
            dragCurrentOffset /
            itemHeight
        );


    currentSongIndex =
        (
            currentSongIndex -
            snapSteps +
            songs.length * 10
        ) %
        songs.length;


    dragCurrentOffset =
        0;


    renderSongSelector();


    try {

        viewportEl.releasePointerCapture(
            e.pointerId
        );

    } catch {}
}


viewportEl.addEventListener(
    "pointerup",
    handleDragEnd
);


viewportEl.addEventListener(
    "pointercancel",
    handleDragEnd
);

            ) ||

            )
        )
    ) {

                src="${selectedSong.jacket}"
                onerror="
                    this.style.display='none';
                    this.parentElement.innerText='🎵';
                "
            >
            `;

    } else {

        creditJacket.innerText =
            selectedSong.jacket ||
            "🎵";
    }


    /*
        -----------------------------------------------------
        READY画面表示
        -----------------------------------------------------
    */

    document.getElementById(
        "credit-screen"
    ).classList.remove(
        "hidden"
    );


    gameState =
        "CREDIT";


    /*
        -----------------------------------------------------
        AudioContext準備
        -----------------------------------------------------
        
        AudioContextはここでは
        ゲーム時計として使用しません。
        
        ブラウザの音声再生準備だけ行います。
    */

    if (
        !audioCtx
    ) {

        audioCtx =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();
    }


    if (
        audioCtx.state ===
        "suspended"
    ) {

        try {

            await audioCtx.resume();

        } catch (
            error
        ) {

            console.warn(
                "AudioContext resume失敗:",
                error
            );
        }
    }


    /*
        -----------------------------------------------------
        READY 3秒
        -----------------------------------------------------
    */

    setTimeout(
        () => {

            startActualGame(
                selectedSong
            );

        },
        3000
    );
}


/* =========================================================
   実際のゲーム開始
========================================================= */

async function startActualGame(
    song
) {

    if (
        !song
    ) return;


    currentSong =
        song;


    /*
        -----------------------------------------------------
        前の音源停止
        -----------------------------------------------------
    */

    if (
        musicAudio
    ) {

        try {

            musicAudio.pause();

            musicAudio.currentTime =
                0;

        } catch (
            error
        ) {

            console.warn(
                "前の音源停止エラー:",
                error
            );
        }


        musicAudio =
            null;
    }


    /*
        -----------------------------------------------------
        譜面読み込み
        -----------------------------------------------------
    */

    let externalData =
        null;


    try {

        externalData =
            await loadExternalChart(
                song
            );

    } catch (
        error
    ) {

        console.error(
            "================================"
        );

        console.error(
            "譜面読み込み失敗"
        );

        console.error(
            error
        );

        console.error(
            "================================"
        );


        alert(
            "譜面ファイルを読み込めませんでした。\n\n" +
            error.message
        );


        returnToSelectFromPause();

        return;
    }


    /*
        -----------------------------------------------------
        chart.jsのデータをcurrentSongへ反映
        -----------------------------------------------------
    */

    if (
        externalData
    ) {

        if (
            externalData.audioSrc
        ) {

            song.audioSrc =
                externalData.audioSrc;
        }


        if (
            externalData.duration
        ) {

            song.chartDuration =
                Number(
                    externalData.duration
                );
        }


        if (
            externalData.jacket
        ) {

            song.jacket =
                externalData.jacket;
        }


        if (
            externalData.title
        ) {

            song.title =
                externalData.title;
        }


        if (
            externalData.artist
        ) {

            song.artist =
                externalData.artist;
        }


        generateChart(
            externalData.chart ||
            []
        );

    } else {

        generateChart(
            []
        );
    }


    /*
        -----------------------------------------------------
        MP3
        -----------------------------------------------------
    */

    musicAudio =
        new Audio();


    musicAudio.src =
        song.audioSrc;


    musicAudio.preload =
        "auto";


    musicAudio.loop =
        false;


    musicAudio.onerror =
        () => {

            console.warn(
                "音源を読み込めません:",
                song.audioSrc
            );
        };


    /*
        -----------------------------------------------------
        ゲーム初期化
        -----------------------------------------------------
    */

    score =
        0;


    totalPausedTime =
        0;


    pauseStartTime =
        0;


    activeTouches.clear();


    judgeCounts = {

        kirari:
            0,

        suteki:
            0,

        ii:
            0,

        alara:
            0
    };


    scoreBoardUpdate();


    /*
        READY画面を閉じる
    */

    document.getElementById(
        "credit-screen"
    ).classList.add(
        "hidden"
    );


    /*
        メニューボタン表示
    */

    document.getElementById(
        "menu-btn"
    ).classList.remove(
        "hidden"
    );


    /*
        -----------------------------------------------------
        AudioContext準備
        -----------------------------------------------------
    */

    if (
        !audioCtx
    ) {

        audioCtx =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();
    }


    if (
        audioCtx.state ===
        "suspended"
    ) {

        try {

            await audioCtx.resume();

        } catch (
            error
        ) {

            console.warn(
                "AudioContext resume失敗:",
                error
            );
        }
    }


    /*
        -----------------------------------------------------
        MP3読み込み準備
        -----------------------------------------------------
        
        「ゲーム時計だけ進んでいるのに
         音楽がまだ鳴っていない」
        
        という状態を防ぎます。
    */

    try {

        await new Promise(
            (
                resolve,
                reject
            ) => {

                /*
                    すでに再生可能なら
                    そのまま進む
                */

                if (
                    musicAudio.readyState >=
                    3
                ) {

                    resolve();

                    return;
                }


                const onReady =
                    () => {

                        cleanup();

                        resolve();
                    };


                const onError =
                    () => {

                        cleanup();

                        reject(
                            new Error(
                                "MP3の読み込みに失敗しました"
                            )
                        );
                    };


                const cleanup =
                    () => {

                        musicAudio.removeEventListener(
                            "canplaythrough",
                            onReady
                        );

                        musicAudio.removeEventListener(
                            "error",
                            onError
                        );
                    };


                musicAudio.addEventListener(
                    "canplaythrough",
                    onReady
                );


                musicAudio.addEventListener(
                    "error",
                    onError
                );


                /*
                    読み込み開始
                */

                musicAudio.load();
            }
        );

    } catch (
        error
    ) {

        console.warn(
            "MP3準備失敗:",
            error
        );


        alert(
            "音源を読み込めませんでした。\n\n" +
            song.audioSrc
        );


        returnToSelectFromPause();

        return;
    }


    /*
        -----------------------------------------------------
        ここが超重要
        -----------------------------------------------------
        
        ゲーム時計を先に開始しません。
        
        まずMP3を再生します。
    */

    try {

        await musicAudio.play();

    } catch (
        error
    ) {

        console.warn(
            "MP3再生に失敗:",
            error
        );


        alert(
            "音楽を再生できませんでした。\n\n" +
            "もう一度曲を選択してください。"
        );


        returnToSelectFromPause();

        return;
    }


    /*
        -----------------------------------------------------
        MP3再生開始
        -----------------------------------------------------
        
        ここからゲーム開始。
        
        今後のゲーム時間は
        musicAudio.currentTime
        を使用します。
    */

    startTime =
        performance.now();


    totalPausedTime =
        0;


    pauseStartTime =
        0;


    gameState =
        "PLAYING";


    console.log(
        "================================"
    );

    console.log(
        "ゲーム開始"
    );

    console.log(
        "MP3:",
        song.audioSrc
    );

    console.log(
        "MP3 currentTime:",
        musicAudio.currentTime
    );

    console.log(
        "================================"
    );
}

========================================================= */

function finishGame() {

    gameState =
        "RESULT";


    if (
        musicAudio
    ) {

        musicAudio.pause();

        musicAudio.currentTime =
            0;
    }


    document.getElementById(
        "menu-btn"
    ).classList.add(
        "hidden"
    );


    const song =
        currentSong ||
        songs[
            currentSongIndex
        ];


    const resultJacket =
        document.getElementById(
            "result-jacket-icon"
        );


    if (
        typeof song.jacket ===
        "string" &&

        (
            song.jacket.endsWith(
                ".png"
            ) ||

            song.jacket.endsWith(
                ".jpg"
            ) ||

            song.jacket.endsWith(
                ".jpeg"
            ) ||

            song.jacket.endsWith(
                ".webp"
            )
        )
    ) {

        resultJacket.innerHTML =
            `
            <img
                src="${song.jacket}"
                onerror="
                    this.style.display='none';
                    this.parentElement.innerText='🎵';
                "
            >
            `;

    } else {

        resultJacket.innerText =
            song.jacket ||
            "🎵";
    }


    document.getElementById(
        "result-song-title"
    ).innerText =
        song.title ||
        song.id;


    document.getElementById(
        "result-song-artist"
    ).innerText =
        song.artist ||
        "";


    document.getElementById(
        "final-score"
    ).innerText =
        score;


    document.getElementById(
        "count-kirari"
    ).innerText =
        judgeCounts.kirari;


    document.getElementById(
        "count-suteki"
    ).innerText =
        judgeCounts.suteki;


    document.getElementById(
        "count-ii"
    ).innerText =
        judgeCounts.ii;


    document.getElementById(
        "count-alara"
    ).innerText =
        judgeCounts.alara;


    const total =
        judgeCounts.kirari +
        judgeCounts.suteki +
        judgeCounts.ii +
        judgeCounts.alara;


    const accuracy =
        total > 0
        ?
        judgeCounts.kirari /
        total *
        100
        :
        0;


    let rank =
        "D";


    if (
        judgeCounts.suteki === 0 &&
        judgeCounts.ii === 0 &&
        judgeCounts.alara === 0 &&
        total > 0
    ) {

        rank =
            "SSS";

    } else if (
        accuracy >= 90
    ) {

        rank =
            "SS";

    } else if (
        accuracy >= 80
    ) {

        rank =
            "S";

    } else if (
        accuracy >= 60
    ) {

        rank =
            "A";

    } else if (
        accuracy >= 40
    ) {

        rank =
            "B";

    } else if (
        accuracy >= 20
    ) {

        rank =
            "C";
    }


    document.getElementById(
        "result-rank"
    ).innerText =
        rank;


    saveSongHighScore(
        song.id,
        score,
        accuracy,
        rank
    );


    document.getElementById(
        "result-screen"
    ).classList.remove(
        "hidden"
    );
}

========================================================= */

function spawnParticles(
    x,
    y,
    color
) {

    for (
        let i = 0;
        i < 10;
        i++
    ) {

        const angle =
            Math.random() *
            Math.PI *
            2;


        const speed =
            2 +
            Math.random() *
            4;


        particles.push({

            x: x,

            y: y,

            vx:
                Math.cos(angle) *
                speed,

            vy:
                Math.sin(angle) *
                speed,

            radius:
                3 +
                Math.random() *
                4,

            color:
                color,

            alpha:
                1,

            decay:
                0.04 +
                Math.random() *
                0.04
        });
    }
}
