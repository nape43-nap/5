<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>絵本風リズムゲーム</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #fdfbf7;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            touch-action: none;
            user-select: none;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 450px;
            max-height: 800px;
            background: #fffdf9;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            border-radius: 20px;
            overflow: hidden;
            border: 8px solid #f0e6d2;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(253, 251, 247, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        h1 {
            color: #7c6f64;
            font-size: 28px;
            margin-bottom: 10px;
        }
        p {
            color: #a89f91;
            font-size: 14px;
            margin-bottom: 30px;
        }
        button {
            background-color: #e3c4a8;
            color: #fff;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(227, 196, 168, 0.4);
            transition: 0.2s;
        }
        button:active {
            transform: scale(0.95);
        }
        #score-board {
            position: absolute;
            top: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            color: #7c6f64;
            font-size: 20px;
            font-weight: bold;
            pointer-events: none;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="score-board">スコア: 0</div>
    <div id="start-screen">
        <h1>おひめさまの音楽会</h1>
        <p>下の5つの丸をタップしてね</p>
        <button id="start-btn">はじめる</button>
    </div>
    <canvas id="gameCanvas"></canvas>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
    canvas.width = canvas.parentElement.clientWidth;
    canvas.height = canvas.parentElement.clientHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

let gameState = 'START';
let score = 0;
let audioCtx = null;
let startTime = 0;

const targetRadius = 34; // 判定枠の大きさ
const noteSpeed = 2.8;   

// 5つの判定レーンの位置（画像のように、左右にゆったり広がる綺麗な弧）
function getLanePositions() {
    let positions = [];
    let centerX = canvas.width / 2;
    let baseY = canvas.height * 0.62; // 画面のやや下側に配置
    let totalWidth = canvas.width * 0.78; // 左右の広がり
    let spacing = totalWidth / 4;

    for (let i = 0; i < 5; i++) {
        let x = centerX - (totalWidth / 2) + (spacing * i);
        // 中央が高く、両端が低くなる綺麗な弧
        let offsetY = -Math.pow((i - 2), 2) * 14 + 30; 
        let y = baseY + offsetY;
        positions.push({ x: x, y: y });
    }
    return positions;
}

let notes = [];
function generateDummyChart() {
    notes = [];
    for (let t = 1.0; t <= 12.0; t += 0.6) {
        let laneIndex = Math.floor(Math.random() * 5);
        notes.push({
            time: t,
            lane: laneIndex,
            hit: false,
            type: 'tap'
        });
    }
}

let animTimer = 0;
let laneHitEffects = [0, 0, 0, 0, 0];

document.getElementById('start-btn').addEventListener('click', () => {
    document.getElementById('start-screen').style.display = 'none';
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    generateDummyChart();
    startTime = audioCtx.currentTime + 1.0;
    gameState = 'PLAYING';
});

function handleLaneTap(laneIndex) {
    if (gameState !== 'PLAYING') return;
    
    let currentTime = audioCtx.currentTime - startTime;
    let closestNote = null;
    let minDiff = 999;

    for (let note of notes) {
        if (!note.hit && note.lane === laneIndex) {
            let diff = Math.abs(currentTime - note.time);
            if (diff < minDiff) {
                minDiff = diff;
                closestNote = note;
            }
        }
    }

    if (closestNote && minDiff < 0.3) {
        closestNote.hit = true;
        if (minDiff < 0.12) {
            score += 300;
            showFeedback("Great!✨");
        } else {
            score += 100;
            showFeedback("Good♪");
        }
        laneHitEffects[laneIndex] = 15;
        document.getElementById('score-board').innerText = `スコア: ${score}`;
        playHitSound();
    }
}

window.addEventListener('pointerdown', (e) => {
    if(e.target.tagName === 'BUTTON') return;
    if(gameState !== 'PLAYING') return;

    const rect = canvas.getBoundingClientRect();
    const touchX = e.clientX - rect.left;
    const touchY = e.clientY - rect.top;

    let lanes = getLanePositions();
    for (let i = 0; i < lanes.length; i++) {
        let distance = Math.hypot(touchX - lanes[i].x, touchY - lanes[i].y);
        if (distance < targetRadius * 1.8) {
            handleLaneTap(i);
            break;
        }
    }
});

function playHitSound() {
    if (!audioCtx) return;
    let osc = audioCtx.createOscillator();
    let gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.1);
}

let feedbackText = "";
let feedbackTimer = 0;
function showFeedback(text) {
    feedbackText = text;
    feedbackTimer = 30;
}

function gameLoop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    animTimer += 0.05;

    let centerX = canvas.width / 2;
    // 女の子（上部の大きなエリア）の位置を決定
    let girlY = canvas.height * 0.3; 
    let lanes = getLanePositions();

    // 1. 上部の女の子エリア（あとで画像をここに貼り付けられます）
    let girlFloatY = Math.sin(animTimer * 2) * 4;
    
    // キャラクター用の大きな丸（プレースホルダー）
    ctx.fillStyle = "#f5d0c5";
    ctx.beginPath();
    ctx.arc(centerX, girlY + girlFloatY + 15, 45, 0, Math.PI * 2); // 以前より大きく
    ctx.fill();
    ctx.strokeStyle = "#e8dfd1";
    ctx.lineWidth = 4;
    ctx.stroke();

    ctx.fillStyle = "#e6beae";
    ctx.beginPath();
    ctx.arc(centerX, girlY + girlFloatY - 15, 30, 0, Math.PI * 2);
    ctx.fill();

    // 2. ガイド線（女の子から各判定枠へ）
    ctx.strokeStyle = "#e8dfd1";
    ctx.lineWidth = 2;
    ctx.setLineDash([4, 8]);
    for (let i = 0; i < lanes.length; i++) {
        ctx.beginPath();
        ctx.moveTo(centerX, girlY);
        ctx.lineTo(lanes[i].x, lanes[i].y);
        ctx.stroke();
    }
    ctx.setLineDash([]);

    // 3. 5つの丸い判定枠の描画
    for (let i = 0; i < lanes.length; i++) {
        let x = lanes[i].x;
        let y = lanes[i].y;

        let currentRadius = targetRadius;
        if (laneHitEffects[i] > 0) {
            laneHitEffects[i]--;
            ctx.fillStyle = "#ffe082";
            currentRadius += 6;
        } else {
            ctx.fillStyle = "rgba(255, 255, 255, 0.9)";
        }

        ctx.strokeStyle = "#d4c5b9";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(x, y, currentRadius, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
    }

    // 4. ノーツの移動と描画（女の子から下へ向かって広がる）
    if (gameState === 'PLAYING') {
        let currentTime = audioCtx.currentTime - startTime;

        for (let note of notes) {
            if (note.hit) continue;

            let progress = (currentTime - (note.time - noteSpeed)) / noteSpeed;

            if (progress >= 0 && progress <= 1.2) {
                let target = lanes[note.lane];
                let x = centerX + (target.x - centerX) * progress;
                let y = girlY + (target.y - girlY) * progress;

                ctx.fillStyle = "#e3c4a8";
                ctx.strokeStyle = "#ffffff";
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(x, y, 16, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
            }

            if (progress > 1.2 && !note.hit) {
                note.hit = true;
            }
        }
    }

    // 5. 判定文字の表示
    if (feedbackTimer > 0) {
        feedbackTimer--;
        ctx.fillStyle = "#d4a373";
        ctx.font = "bold 24px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(feedbackText, centerX, girlY - 70);
    }

    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>

</body>
</html>
