        if (
            touchInfo.assignedNote &&
            touchInfo.assignedNote.holding
        ) {

            const note =
                touchInfo.assignedNote;


            if (
                note.type ===
                    "slidenode" ||

                note.type ===
                    "slide"
            ) {

                const lanes =
                    getLanePositions();


                const path =
                    note.path ||
                    [
                        note.lane
                    ];


                const endLane =
                    path[
                        path.length - 1
                    ];


                const target =
                    lanes[
                        endLane
                    ];


                if (
                    target &&
                    Math.hypot(

                        touchX -
                        target.x,

                        touchY -
                        target.y

                    ) <
                    targetRadius *
                    2.5
                ) {

                    note.hit =
                        true;


                    note.holding =
                        false;


                    touchInfo.assignedNote =
                        null;

                    addCombo();

                    score +=
                        300;


                    judgeCounts.kirari++;


                    showFloatingText(
                        "PERFECT",
                        "#f1c40f",
                        target.x,
                        target.y - 40
                    );


                    spawnParticles(
                        target.x,
                        target.y,
                        "#e056fd"
                    );


                    scoreBoardUpdate();
                }
            }
        }
    }
);


/* =========================================================
   タッチ終了
========================================================= */

canvas.addEventListener(
    "pointerup",
    handleTouchEndOrCancel
);

canvas.addEventListener(
    "pointercancel",
    handleTouchEndOrCancel
);


function handleTouchEndOrCancel(
    e
) {

    if (
        !activeTouches.has(
            e.pointerId
        )
    ) return;


    const touchInfo =
        activeTouches.get(
            e.pointerId
        );


    /*
        現在の曲時間
    */

    const currentTime =
        musicAudio
            ? musicAudio.currentTime
            : 0;


    const lanes =
        getLanePositions();


    /*
        =========================================
        LONG / SLIDE
        =========================================
    */

    if (
        touchInfo.assignedNote
    ) {

        const note =
            touchInfo.assignedNote;


        /*
            -------------------------------------
            LONG終了
            -------------------------------------
        */

        if (
            note.type ===
            "long" &&
            note.holding
        ) {

            const endTime =
                note.time +
                note.duration;


            const diff =
                Math.abs(
                    currentTime -
                    endTime
                );


            const lane =
                lanes[
                    note.lane
                ];


            /*
                PERFECT
            */

            if (
                diff < 0.12 &&
                currentTime >= endTime
            ) {

                /*
                    LONG成功
                    コンボ加算
                */

                addCombo();

                score +=
                    400;

                judgeCounts.kirari++;

                showFloatingText(
                    "PERFECT",
                    "#f1c40f",
                    lane.x,
                    lane.y - 40
                );


            /*
                GREAT
            */

            } else if (
                diff < 0.28 &&
                currentTime >=
                    endTime - 0.15
            ) {

                /*
                    LONG成功
                    コンボ加算
                */

             addCombo();

                score +=
                    250;

                judgeCounts.suteki++;

                showFloatingText(
                    "GREAT",
                    "#e67e22",
                    lane.x,
                    lane.y - 40
                );


            /*
                MISS
            */

            } else {

                score +=
                    50;

                judgeCounts.alara++;

                resetCombo();

                showFloatingText(
                    "MISS",
                    "#95a5a6",
                    lane.x,
                    lane.y - 40
                );
            }


            note.hit =
                true;

            note.holding =
                false;


            scoreBoardUpdate();
        }


        /*
            -------------------------------------
            LONG放置MISS
            -------------------------------------
        */

        if (
            note.type ===
            "long" &&
            !note.started &&
            currentTime >=
                note.time +
                note.duration +
                0.35 &&
            !note.hit
        ) {

            const lane =
                lanes[
                    note.lane
                ];


            note.hit =
                true;


            judgeCounts.alara++;

            resetCombo();


            if (lane) {

                showFloatingText(
                    "MISS",
                    "#95a5a6",
                    lane.x,
                    lane.y - 40
                );
            }
        }


        /*
            -------------------------------------
            SLIDE終了
            -------------------------------------
        */

        else if (
            (
                note.type ===
                    "slidenode" ||
                note.type ===
                    "slide"
            ) &&
            note.holding
        ) {

            const path =
                note.path ||
                [
                    note.lane
                ];


            const endLane =
                path[
                    path.length - 1
                ];


            const target =
                lanes[
                    endLane
                ];


            if (
                !target
            ) {

                activeTouches.delete(
                    e.pointerId
                );

                return;
            }


            const distance =
                Math.hypot(
                    touchInfo.currentX -
                    target.x,

                    touchInfo.currentY -
                    target.y
                );


            /*
                SLIDE成功
            */

            if (
                distance <
                targetRadius *
                2.5
            ) {

                /*
                    SLIDE成功
                    コンボ加算
                */

                addCombo();

                score +=
                    200;

                judgeCounts.suteki++;

                showFloatingText(
                    "GREAT",
                    "#e67e22",
                    target.x,
                    target.y - 40
                );


            /*
                SLIDE MISS
            */

            } else {

                judgeCounts.alara++;

                resetCombo();

                showFloatingText(
                    "MISS",
                    "#95a5a6",
                    target.x,
                    target.y - 40
                );
            }


            note.hit =
                true;

            note.holding =
                false;


            scoreBoardUpdate();
        }

    }


    /*
        =========================================
        FLICK
        =========================================
    */

    else {

        for (
            let note of notes
        ) {

            if (
                note.hit ||
                note.type !==
                "flick"
            ) continue;


            /*
                タイミング判定
            */

            const diff =
                Math.abs(
                    currentTime -
                    note.time
                );


            if (
                diff >= 0.4
            ) continue;


            /*
                フリック対象レーン
            */

            const lane =
                lanes[
                    note.lane
                ];


            if (
                !lane
            ) continue;


            /*
                フリック開始位置
            */

            const touchDistance =
                Math.hypot(
                    touchInfo.startX -
                    lane.x,

                    touchInfo.startY -
                    lane.y
                );


            if (
                touchDistance >
                targetRadius * 2.5
            ) continue;


            /*
                フリックした距離
            */

            const distance =
                Math.hypot(

                    touchInfo.currentX -
                    touchInfo.startX,

                    touchInfo.currentY -
                    touchInfo.startY
                );


            /*
                FLICK成功
            */

            if (
                distance > 15
            ) {

                note.hit =
                    true;


                /*
                    FLICK成功
                    コンボ加算
                */

                addCombo();

                score +=
                    350;

                judgeCounts.kirari++;


                showFloatingText(
                    "PERFECT",
                    "#f1c40f",
                    lane.x,
                    lane.y - 40
                );


                spawnParticles(
                    lane.x,
                    lane.y,
                    "#9b59b6"
                );


                scoreBoardUpdate();


                break;
            }
        }
    }


    /*
        =========================================
        タッチ終了処理
        =========================================
    */

    try {

        canvas.releasePointerCapture(
            e.pointerId
        );

    } catch {}


    activeTouches.delete(
        e.pointerId
    );
}


/* =========================================================
   ゲームループ（絵本風 表示）
========================================================= */

let animTimer =
    0;

/* ノーツごとの「ちょっとだけ傾ける」ための種 */
let curNoteSeed = 0;

const INK = "#7c6f64";          /* 線の色（こげ茶） */


/* 角丸四角形のパス */
function rrPath(x, y, w, h, r) {

    r = Math.min(r, w / 2, h / 2);

    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
}


/* ノーツの色（やさしいパステル） */
const NOTE_COLORS = {

    tap: {
        top: "#d3f3e6",
        bottom: "#8fd6b9",
        side: "#5fa88b"
    },

    flick: {
        top: "#ffd4dc",
        bottom: "#f29bb0",
        side: "#c06c82"
    },

    long: {
        top: "#fff0bd",
        bottom: "#f5c45e",
        side: "#c4902e"
    },

    slide: {
        top: "#eadcfa",
        bottom: "#bb9be6",
        side: "#8566b8"
    }
};


/* =========================================================
   背景（紙に描いた絵のような景色）
   一度だけ作って使い回すので軽いです
========================================================= */

let bgCache = null;
let bgCacheKey = "";


function seededRandom(seed) {

    let s = seed;

    return function () {

        s = (s * 16807) % 2147483647;

        return (s - 1) / 2147483646;
    };
}


function drawTree(c, x, y, size) {

    /* みき */
    c.fillStyle = "#c9a27e";
    c.fillRect(x - size * 0.08, y - size * 0.35, size * 0.16, size * 0.4);

    /* はっぱ */
    c.fillStyle = "#9fd08a";
    c.strokeStyle = "rgba(124,111,100,0.55)";
    c.lineWidth = 1.5;

    c.beginPath();
    c.arc(x, y - size * 0.62, size * 0.38, 0, Math.PI * 2);
    c.fill();
    c.stroke();

    c.fillStyle = "rgba(255,255,255,0.28)";

    c.beginPath();
    c.arc(
        x - size * 0.12,
        y - size * 0.72,
        size * 0.14,
        0,
        Math.PI * 2
    );
    c.fill();
}


function drawFlower(c, x, y, r, color) {

    c.fillStyle = color;

    for (let k = 0; k < 5; k++) {

        const a = (Math.PI * 2 / 5) * k;

        c.beginPath();
        c.arc(
            x + Math.cos(a) * r,
            y + Math.sin(a) * r,
            r * 0.8,
            0,
            Math.PI * 2
        );
        c.fill();
    }

    c.fillStyle = "#ffe08a";

    c.beginPath();
    c.arc(x, y, r * 0.7, 0, Math.PI * 2);
    c.fill();
}


function buildBackground(w, h) {

    const off =
        document.createElement("canvas");

    off.width = w;
    off.height = h;

    const c = off.getContext("2d");

    const rnd = seededRandom(20240607);

    /* ---------- そら ---------- */

    const sky =
        c.createLinearGradient(0, 0, 0, h * 0.4);

    sky.addColorStop(0, "#bfe3f2");
    sky.addColorStop(1, "#fdf1dc");

    c.fillStyle = sky;
    c.fillRect(0, 0, w, h);

    /* ---------- おひさま ---------- */

    const sunX = w * 0.82;
    const sunY = h * 0.1;

    const sunGlow =
        c.createRadialGradient(
            sunX, sunY, 6,
            sunX, sunY, 70
        );

    sunGlow.addColorStop(0, "rgba(255,236,160,0.9)");
    sunGlow.addColorStop(1, "rgba(255,236,160,0)");

    c.fillStyle = sunGlow;
    c.fillRect(0, 0, w, h * 0.3);

    c.fillStyle = "#ffe596";
    c.beginPath();
    c.arc(sunX, sunY, 24, 0, Math.PI * 2);
    c.fill();

    /* ---------- とおくの丘 ---------- */

    c.fillStyle = "#cfe6c4";

    c.beginPath();
    c.moveTo(0, h * 0.34);

    c.bezierCurveTo(
        w * 0.2, h * 0.24,
        w * 0.35, h * 0.3,
        w * 0.5, h * 0.28
    );

    c.bezierCurveTo(
        w * 0.7, h * 0.24,
        w * 0.85, h * 0.3,
        w, h * 0.26
    );

    c.lineTo(w, h);
    c.lineTo(0, h);
    c.closePath();
    c.fill();

    /* ---------- 手前の丘（草原） ---------- */

    const grass =
        c.createLinearGradient(0, h * 0.3, 0, h);

    grass.addColorStop(0, "#c2e2a8");
    grass.addColorStop(1, "#9fcf86");

    c.fillStyle = grass;

    c.beginPath();
    c.moveTo(0, h * 0.36);

    c.bezierCurveTo(
        w * 0.25, h * 0.31,
        w * 0.4, h * 0.35,
        w * 0.55, h * 0.33
    );

    c.bezierCurveTo(
        w * 0.75, h * 0.3,
        w * 0.9, h * 0.34,
        w, h * 0.31
    );

    c.lineTo(w, h);
    c.lineTo(0, h);
    c.closePath();
    c.fill();

    /* ---------- 木 ---------- */

    drawTree(c, w * 0.08, h * 0.37, 62);
    drawTree(c, w * 0.93, h * 0.34, 70);
    drawTree(c, w * 0.18, h * 0.33, 40);
    drawTree(c, w * 0.84, h * 0.31, 36);

    /* ---------- 草の中のお花 ---------- */

    const flowerColors =
        ["#ffb7c5", "#fff3b0", "#ffffff", "#ffc9a8"];

    for (let i = 0; i < 38; i++) {

        const fy = h * (0.4 + rnd() * 0.58);

        /* 小道（中央）にはかからないようにする */
        const side = rnd() < 0.5 ? -1 : 1;

        const fy01 = (fy - h * 0.3) / (h * 0.7);

        const pathHalf =
            w * (0.12 + 0.4 * fy01);

        const fx =
            w / 2 +
            side *
            (pathHalf + 12 + rnd() * w * 0.2);

        if (fx < 8 || fx > w - 8) continue;

        drawFlower(
            c,
            fx,
            fy,
            3 + rnd() * 2.5,
            flowerColors[
                Math.floor(rnd() * flowerColors.length)
            ]
        );
    }

    /* ---------- 紙のざらざら ---------- */

    for (let i = 0; i < 700; i++) {

        c.fillStyle =
            rnd() < 0.5
            ? "rgba(124,111,100,0.05)"
            : "rgba(255,255,255,0.18)";

        c.fillRect(
            rnd() * w,
            rnd() * h,
            1 + rnd() * 1.5,
            1 + rnd() * 1.5
        );
    }

    /* ---------- ふちのやわらかい影（本のページ風） ---------- */

    const vig =
        c.createRadialGradient(
            w / 2, h / 2, h * 0.35,
            w / 2, h / 2, h * 0.8
        );

    vig.addColorStop(0, "rgba(160,120,80,0)");
    vig.addColorStop(1, "rgba(160,120,80,0.18)");

    c.fillStyle = vig;
    c.fillRect(0, 0, w, h);

    return off;
}


function drawCloud(x, y, scale) {

    ctx.fillStyle = "rgba(255,255,255,0.92)";

    ctx.beginPath();
    ctx.arc(x, y, 16 * scale, 0, Math.PI * 2);
    ctx.arc(x + 18 * scale, y - 8 * scale, 20 * scale, 0, Math.PI * 2);
    ctx.arc(x + 40 * scale, y, 16 * scale, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillRect(
        x,
        y - 2 * scale,
        40 * scale,
        14 * scale
    );
}


/* =========================================================
   ノーツ（紙で作ったカードのような長方形）
========================================================= */

function drawNote3D(
    g,
    cx,
    cy,
    s,
    rot,
    palette,
    symbol,
    alpha
) {

    /* 丸ノーツ（向きは関係ないので rot は使いません） */
    const r = g.noteW * 0.5 * s;

    const depth =
        Math.max(2, 5 * s);

    ctx.save();

    ctx.globalAlpha = alpha;

    ctx.translate(cx, cy);

    /* かげ */
    ctx.beginPath();
    ctx.arc(1, depth + 3 * s, r, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(124,111,100,0.22)";
    ctx.fill();

    /* 厚み */
    ctx.beginPath();
    ctx.arc(0, depth, r, 0, Math.PI * 2);
    ctx.fillStyle = palette.side;
    ctx.fill();

    /* 表面 */
    const grad =
        ctx.createLinearGradient(0, -r, 0, r);

    grad.addColorStop(0, palette.top);
    grad.addColorStop(1, palette.bottom);

    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.fillStyle = grad;
    ctx.fill();

    /* こげ茶のふち */
    ctx.lineWidth = Math.max(1.5, 3 * s);
    ctx.strokeStyle = INK;
    ctx.stroke();

    /* ぬい目 */
    ctx.beginPath();
    ctx.arc(0, 0, r * 0.68, 0, Math.PI * 2);

    ctx.setLineDash([
        Math.max(2, 5 * s),
        Math.max(2, 4 * s)
    ]);

    ctx.lineWidth = Math.max(1, 1.8 * s);
    ctx.strokeStyle = "rgba(255,255,255,0.95)";
    ctx.stroke();

    ctx.setLineDash([]);

    /* 記号 */
    if (symbol) {

        ctx.font =
            "bold " +
            Math.max(8, r * 0.95) +
            "px sans-serif";

        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        ctx.lineWidth = Math.max(2, 3 * s);
        ctx.strokeStyle = INK;
        ctx.strokeText(symbol, 0, r * 0.05);

        ctx.fillStyle = "#ffffff";
        ctx.fillText(symbol, 0, r * 0.05);
    }

    ctx.restore();
}


/* 登場時はふわっと出て、判定を過ぎたら薄くなる */
function noteAlpha(p) {

    let a = 1;

    if (p < 0.12) {

        a = Math.max(0, p / 0.12);
    }

    if (p > 1) {

        a = Math.max(0.25, 1 - (p - 1) * 3);
    }

    return a;
}


/* ロングノーツの帯（リボン） */
function drawLongBody(
    g,
    ph,
    pt,
    alpha
) {

    /* ノーツの横方向（帯の幅の向き） */
    const ax = Math.cos(ph.rot);
    const ay = Math.sin(ph.rot);

    const hwH = g.noteW * ph.s * 0.34;
    const hwT = g.noteW * pt.s * 0.34;

    ctx.save();

    ctx.globalAlpha = alpha;

    const grad =
        ctx.createLinearGradient(
            pt.x, pt.y, ph.x, ph.y
        );

    grad.addColorStop(0, "rgba(255,235,170,0.75)");
    grad.addColorStop(1, "rgba(250,205,100,0.92)");

    ctx.fillStyle = grad;

    ctx.beginPath();
    ctx.moveTo(pt.x - ax * hwT, pt.y - ay * hwT);
    ctx.lineTo(pt.x + ax * hwT, pt.y + ay * hwT);
    ctx.lineTo(ph.x + ax * hwH, ph.y + ay * hwH);
    ctx.lineTo(ph.x - ax * hwH, ph.y - ay * hwH);
    ctx.closePath();
    ctx.fill();

    ctx.strokeStyle = INK;
    ctx.lineWidth = 2;
    ctx.stroke();

    /* 中央のぬい目 */
    ctx.setLineDash([6, 5]);
    ctx.strokeStyle = "rgba(255,255,255,0.9)";
    ctx.lineWidth = 1.5;

    ctx.beginPath();
    ctx.moveTo(pt.x, pt.y);
    ctx.lineTo(ph.x, ph.y);
    ctx.stroke();

    ctx.setLineDash([]);

    ctx.restore();
}


/* スライドの帯（始点→終点。弧に沿ってつなぐ） */
function drawSlideBody(
    g,
    laneA,
    laneB,
    p,
    alpha
) {

    const s = depthScale(p);

    const bandH = g.noteH * s * 0.55;

    const line = [];

    for (let i = 0; i <= 10; i++) {

        line.push(
            fanPos(
                g,
                laneA + (laneB - laneA) * i / 10,
                p
            )
        );
    }

    ctx.save();

    ctx.globalAlpha = alpha;

    ctx.lineCap = "round";
    ctx.lineJoin = "round";

    const trace = () => {

        ctx.beginPath();
        ctx.moveTo(line[0].x, line[0].y);

        for (let i = 1; i < line.length; i++) {

            ctx.lineTo(line[i].x, line[i].y);
        }
    };

    /* ふち */
    trace();
    ctx.strokeStyle = INK;
    ctx.lineWidth = bandH + Math.max(2, 4 * s);
    ctx.stroke();

    /* 中身 */
    trace();
    ctx.strokeStyle = "rgba(210,188,246,0.95)";
    ctx.lineWidth = bandH;
    ctx.stroke();

    /* ぬい目 */
    trace();
    ctx.setLineDash([6, 5]);
    ctx.strokeStyle = "rgba(255,255,255,0.95)";
    ctx.lineWidth = 1.5;
    ctx.stroke();

    ctx.setLineDash([]);

    ctx.restore();
}


/* =========================================================
   背景・扇・判定の弧
========================================================= */

function drawStage(
    g,
    currentTime,
    travelTime,
    pressed
) {

    const w = g.w;
    const h = g.h;
    const O = g.O;

    /* ---------- 背景（キャッシュ） ---------- */

    const key = w + "x" + h;

    if (!bgCache || bgCacheKey !== key) {

        bgCache = buildBackground(w, h);
        bgCacheKey = key;
    }

    ctx.drawImage(bgCache, 0, 0);

    /* ---------- ゆっくり流れる雲 ---------- */

    const cloudDefs = [
        { base: 0.1, y: 0.07, sc: 1.1, sp: 4 },
        { base: 0.55, y: 0.14, sc: 0.8, sp: 3 },
        { base: 0.85, y: 0.04, sc: 0.9, sp: 5 }
    ];

    for (const cd of cloudDefs) {

        const x =
            ((cd.base * w + animTimer * cd.sp * 3) %
            (w + 160)) - 80;

        drawCloud(x, h * cd.y, cd.sc);
    }

    /* ---------- 扇（広がる小道） ---------- */

    ctx.beginPath();
    ctx.moveTo(O.x, O.y);

    for (let a = -64; a <= 64; a += 8) {

        const p = ellipsePt(g, a, 1.22);

        ctx.lineTo(p.x, p.y);
    }

    ctx.closePath();

    const fanGrad =
        ctx.createRadialGradient(
            O.x, O.y, 10,
            O.x, O.y, h * 0.62
        );

    fanGrad.addColorStop(0, "#fff7e6");
    fanGrad.addColorStop(1, "#ffeccb");

    ctx.fillStyle = fanGrad;
    ctx.fill();

    /* ふち（ぬい目） */
    ctx.lineJoin = "round";

    ctx.strokeStyle = "#d9b48c";
    ctx.lineWidth = 6;
    ctx.stroke();

    ctx.strokeStyle = INK;
    ctx.lineWidth = 1.5;
    ctx.stroke();

    ctx.setLineDash([7, 7]);
    ctx.strokeStyle = "#fffdf9";
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.setLineDash([]);

    /* ---------- 押している道をほんのり光らせる ---------- */

    for (let i = 0; i < 5; i++) {

        if (!pressed[i]) continue;

        const a = FAN.angles[i];

        const P = g.pts[i];

        const e1 = ellipsePt(g, a - 13, 1.0);
        const e2 = ellipsePt(g, a, 1.0);
        const e3 = ellipsePt(g, a + 13, 1.0);

        const glow =
            ctx.createLinearGradient(
                O.x, O.y, P.x, P.y
            );

        glow.addColorStop(0, "rgba(255,226,150,0)");
        glow.addColorStop(1, "rgba(255,214,120,0.7)");

        ctx.fillStyle = glow;

        ctx.beginPath();
        ctx.moveTo(O.x, O.y);
        ctx.lineTo(e1.x, e1.y);
        ctx.lineTo(e2.x, e2.y);
        ctx.lineTo(e3.x, e3.y);
        ctx.closePath();
        ctx.fill();
    }

    /* ---------- 拍の波（ノーツと同じ速さで広がる） ---------- */

    const beat = 0.5;

    const mStart =
        Math.ceil(
            (currentTime - 0.2 * travelTime) / beat
        );

    const mEnd =
        Math.floor(
            (currentTime + travelTime) / beat
        );

    ctx.strokeStyle = INK;
    ctx.setLineDash([4, 7]);
    ctx.lineCap = "round";

    for (
        let m = mStart;
        m <= mEnd && m - mStart < 40;
        m++
    ) {

        const tm = m * beat;

        const p =
            (currentTime - tm + travelTime) /
            travelTime;

        if (p < 0 || p > 1.2) continue;

        const s = depthScale(p);

        const q = (s - g.s0) / (1 - g.s0);

        ctx.globalAlpha =
            0.22 * Math.min(1, p * 4);

        ctx.lineWidth =
            Math.max(1, 2 * s);

        ctx.beginPath();

        for (let a = -64; a <= 64; a += 8) {

            const B = ellipsePt(g, a, 1.0);

            const x = O.x + (B.x - O.x) * q;
            const y = O.y + (B.y - O.y) * q;

            if (a === -64) {

                ctx.moveTo(x, y);

            } else {

                ctx.lineTo(x, y);
            }
        }

        ctx.stroke();
    }

    ctx.globalAlpha = 1;

    /* ---------- 道の区切り（ぽんぽん点線） ---------- */

    ctx.setLineDash([1, 9]);
    ctx.lineWidth = 3.5;
    ctx.strokeStyle = "rgba(124,111,100,0.35)";

    for (const a of [-43, -15, 15, 43]) {

        const E = ellipsePt(g, a, 1.22);

        ctx.beginPath();
        ctx.moveTo(O.x, O.y);
        ctx.lineTo(E.x, E.y);
        ctx.stroke();
    }

    ctx.setLineDash([]);

    /* ---------- 判定の弧（ロープ） ---------- */

    ctx.lineCap = "round";
    ctx.lineJoin = "round";

    const arc = () => {

        ctx.beginPath();

        for (let a = -62; a <= 62; a += 4) {

            const p = ellipsePt(g, a, 1.0);

            if (a === -62) {

                ctx.moveTo(p.x, p.y);

            } else {

                ctx.lineTo(p.x, p.y);
            }
        }
    };

    arc();
    ctx.strokeStyle = "#d4a373";
    ctx.lineWidth = 6;
    ctx.stroke();

    arc();
    ctx.setLineDash([6, 6]);
    ctx.strokeStyle = "#fffdf9";
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.setLineDash([]);
    ctx.lineCap = "butt";

    /* ---------- 5つの「ここで押す」枠（まる） ---------- */

    const fr = g.noteW * 0.56;

    for (let i = 0; i < 5; i++) {

        const P = g.pts[i];

        ctx.beginPath();
        ctx.arc(P.x, P.y, fr, 0, Math.PI * 2);

        ctx.fillStyle =
            pressed[i]
            ? "rgba(255,233,160,0.95)"
            : "rgba(255,255,255,0.6)";

        ctx.fill();

        ctx.setLineDash([6, 5]);
        ctx.strokeStyle = "#a8927d";
        ctx.lineWidth = 2.5;
        ctx.stroke();
        ctx.setLineDash([]);
    }
}


/* =========================================================
   女の子（扇の要の、草の丘に立っている）
========================================================= */

function drawGirl(g) {

    const feetY =
        g.O.y + 16;

    const bob =
        Math.sin(animTimer * 2) * 4;

    /* 草の小さな丘 */

    ctx.fillStyle = "#b5dc98";

    ctx.beginPath();
    ctx.ellipse(
        g.cx,
        feetY,
        78,
        20,
        0,
        0,
        Math.PI * 2
    );
    ctx.fill();

    ctx.strokeStyle = "rgba(124,111,100,0.5)";
    ctx.lineWidth = 1.5;
    ctx.stroke();

    /* 小さなお花 */

    drawFlower(ctx, g.cx - 52, feetY + 2, 3.5, "#ffb7c5");
    drawFlower(ctx, g.cx + 55, feetY - 2, 3.5, "#fff3b0");
    drawFlower(ctx, g.cx + 38, feetY + 6, 3, "#ffffff");

    /* 足元のかげ */

    ctx.fillStyle = "rgba(124,111,100,0.2)";

    ctx.beginPath();
    ctx.ellipse(
        g.cx,
        feetY + 2,
        34,
        8,
        0,
        0,
        Math.PI * 2
    );
    ctx.fill();

    if (
        girlImg.complete &&
        girlImg.naturalWidth !== 0
    ) {

        const gh = 130;

        const gw =
            gh *
            girlImg.naturalWidth /
            girlImg.naturalHeight;

        ctx.drawImage(
            girlImg,
            g.cx - gw / 2,
            feetY - gh + bob,
            gw,
            gh
        );

    } else {

        ctx.fillStyle = "#f5d0c5";

        ctx.beginPath();
        ctx.arc(
            g.cx,
            feetY - 60 + bob,
            45,
            0,
            Math.PI * 2
        );
        ctx.fill();
    }
}


/*
    ノーツが流れてくる時間の倍率
    大きいほどゆっくり流れます（1.0 = 以前の速さ）
    設定画面のスライダーはこの上にさらに掛かります
*/
const NOTE_TRAVEL_SCALE = 2.1;


function gameLoop() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    autoPlayUpdate();

    animTimer +=
        0.05;

    const g =
        getHighwayGeometry();

    HW = g;

    const lanes =
        getLanePositions();

    if (
        gameState ===
        "PLAYING"
    ) {

        const currentTime =
            musicAudio
                ? musicAudio.currentTime
                : 0;

        const effectiveNoteSpeed =
            baseNoteSpeed *
            noteSpeedMultiplier;

        /*
            曲終了
        */
        if (
            musicAudio &&
            musicAudio.ended
        ) {

            finishGame();

            requestAnimationFrame(
                gameLoop
            );

            return;
        }

        const travelTime =
            (
                baseNoteSpeed /
                effectiveNoteSpeed
            ) *
            NOTE_TRAVEL_SCALE;

        /*
            押されているレーン
        */
        const pressed =
            [false, false, false, false, false];

        activeTouches.forEach(
            t => {

                for (
                    let i = 0;
                    i < lanes.length;
                    i++
                ) {

                    if (
                        Math.hypot(
                            t.currentX -
                            lanes[i].x,
                            t.currentY -
                            lanes[i].y
                        ) <
                        targetRadius * 1.3
                    ) {

                        pressed[i] = true;
                    }
                }
            }
        );

        for (
            const n of notes
        ) {

            if (
                n.holding &&
                !n.hit &&
                pressed[n.lane] !== undefined
            ) {

                pressed[n.lane] = true;
            }
        }

        /*
            背景・レーン・判定ライン・女の子
        */
        drawStage(
            g,
            currentTime,
            travelTime,
            pressed
        );

        drawGirl(g);

        /*
            ノーツ
            （奥のものから順に描くためキューに溜める）
        */
        const drawQueue = [];

        for (
            let note of notes
        ) {

            if (
                note.hit
            ) continue;

            const target =
                lanes[
                    note.lane
                ];

            if (
                !target
            ) continue;

            /*
                TAP / FLICK
            */
            if (
                note.type ===
                    "tap" ||
                note.type ===
                    "flick"
            ) {

                const progress =
                    (
                        currentTime -
                        (
                            note.time -
                            travelTime
                        )
                    ) /
                    travelTime;

                if (
                    progress >= 0 &&
                    progress <= 1.2
                ) {

                    const isFlick =
                        note.type ===
                        "flick";

                    drawQueue.push({

                        p: progress,

                        fn: () => {
                            curNoteSeed = note.time * 37 + note.lane * 11;

                            const pos =
                                fanPos(
                                    g,
                                    note.lane,
                                    progress
                                );

                            drawNote3D(
                                g,
                                pos.x,
                                pos.y,
                                pos.s,
                                pos.rot,
                                isFlick
                                    ? NOTE_COLORS.flick
                                    : NOTE_COLORS.tap,
                                isFlick
                                    ? "◆"
                                    : null,
                                noteAlpha(progress)
                            );
                        }
                    });
                }

                if (
                    progress > 1.2 &&
                    !note.hit
                ) {

                    note.hit =
                        true;

                    judgeCounts.alara++;

                    resetCombo();

                    showFloatingText(
                        "MISS",
                        "#95a5a6",
                        target.x,
                        target.y - 40
                    );
                }
            }

            /*
                LONG
            */
            else if (
                note.type ===
                "long"
            ) {

                const endTime =
                    note.time +
                    note.duration;

                const headProg =
                    (
                        currentTime -
                        (
                            note.time -
                            travelTime
                        )
                    ) /
                    travelTime;

                const tailProg =
                    (
                        currentTime -
                        (
                            endTime -
                            travelTime
                        )
                    ) /
                    travelTime;

                if (
                    headProg >= 0 &&
                    tailProg <= 1.2
                ) {

                    /*
                        頭：判定ラインに着いたら
                        （または押し始めたら）そこで止まる
                    */
                    const headP =
                        (
                            headProg >= 1 ||
                            note.started
                        )
                        ? 1
                        : Math.max(
                            0,
                            headProg
                        );

                    /*
                        終点
                    */
                    const tailP =
                        tailProg >= 1
                        ? 1
                        : Math.max(
                            0,
                            tailProg
                        );

                    drawQueue.push({

                        p: headP,

                        fn: () => {
                            curNoteSeed = note.time * 37 + note.lane * 11;

                            const a =
                                noteAlpha(
                                    Math.min(headP, 1)
                                );

                            const ph =
                                fanPos(
                                    g,
                                    note.lane,
                                    headP
                                );

                            const pt =
                                fanPos(
                                    g,
                                    note.lane,
                                    tailP
                                );

                            /* 帯 */
                            drawLongBody(
                                g,
                                ph,
                                pt,
                                a
                            );

                            /* 終点 */
                            if (
                                tailProg >= 0 &&
                                currentTime < endTime
                            ) {

                                drawNote3D(
                                    g,
                                    pt.x,
                                    pt.y,
                                    pt.s,
                                    pt.rot,
                                    NOTE_COLORS.long,
                                    null,
                                    noteAlpha(tailP)
                                );
                            }

                            /* 頭 */
                            drawNote3D(
                                g,
                                ph.x,
                                ph.y,
                                ph.s,
                                ph.rot,
                                NOTE_COLORS.long,
                                null,
                                a
                            );
                        }
                    });

                    /*
                        押している途中で
                        大幅に離した場合
                    */
                    if (
                        note.holding
                    ) {

                        if (
                            currentTime >=
                            endTime +
                            0.35 &&
                            !note.hit
                        ) {

                            note.hit =
                                true;

                            note.holding =
                                false;

                            judgeCounts.alara++;

                            resetCombo();

                            showFloatingText(
                                "MISS",
                                "#95a5a6",
                                target.x,
                                target.y - 40
                            );
                        }
                    }
                }

                /*
                    LONGを一度も押さなかった場合
                */
                if (
                    !note.started &&
                    currentTime >=
                    endTime +
                    0.35 &&
                    !note.hit
                ) {

                    note.hit =
                        true;

                    judgeCounts.alara++;

                    resetCombo();

                    showFloatingText(
                        "MISS",
                        "#95a5a6",
                        target.x,
                        target.y - 40
                    );
                }
            }

            /*
                SLIDE
            */
            else if (
                note.type ===
                    "slidenode" ||
                note.type ===
                    "slide"
            ) {

                const path =
                    note.path ||
                    [
                        note.lane
                    ];

                const progress =
                    (
                        currentTime -
                        (
                            note.time -
                            travelTime
                        )
                    ) /
                    travelTime;

                const startLane =
                    path[0];

                const endLane =
                    path[
                        path.length - 1
                    ];

                if (
                    !lanes[startLane] ||
                    !lanes[endLane]
                ) continue;

                if (
                    progress >= 0 &&
                    progress <= 1.5
                ) {

                    /*
                        判定ラインを過ぎたら
                        判定ラインの位置で止める
                    */
                    const drawP =
                        Math.min(
                            progress,
                            1
                        );

                    drawQueue.push({

                        p: drawP,

                        fn: () => {
                            curNoteSeed = note.time * 37 + note.lane * 11;

                            const a =
                                noteAlpha(drawP);

                            /* 帯 */
                            drawSlideBody(
                                g,
                                startLane,
                                endLane,
                                drawP,
                                a
                            );

                            const pe =
                                fanPos(
                                    g,
                                    endLane,
                                    drawP
                                );

                            const ps =
                                fanPos(
                                    g,
                                    startLane,
                                    drawP
                                );

                            /* 終点 */
                            drawNote3D(
                                g,
                                pe.x,
                                pe.y,
                                pe.s,
                                pe.rot,
                                NOTE_COLORS.slide,
                                null,
                                a
                            );

                            /* 始点（矢印つき） */
                            drawNote3D(
                                g,
                                ps.x,
                                ps.y,
                                ps.s,
                                ps.rot,
                                NOTE_COLORS.slide,
                                note.direction === "left"
                                    ? "◀︎"
                                    : "▶︎",
                                a
                            );
                        }
                    });
                }

                if (
                    progress > 1.5 &&
                    !note.hit &&
                    !autoPlay
                ) {

                    note.hit =
                        true;

                    judgeCounts.alara++;

                    resetCombo();

                    const endPos =
                        lanes[
                            endLane
                        ];

                    if (endPos) {

                        showFloatingText(
                            "MISS",
                            "#95a5a6",
                            endPos.x,
                            endPos.y - 40
                        );
                    }
                }
            }
        }

        /*
            奥 → 手前の順に描く
        */
        drawQueue.sort(
            (a, b) =>
                a.p - b.p
        );

        for (
            const item of drawQueue
        ) {

            item.fn();
        }
    }

    /*
        パーティクル
    */
    for (
        let i =
            particles.length - 1;
        i >= 0;
        i--
    ) {

        const p =
            particles[i];

        p.x +=
            p.vx;

        p.y +=
            p.vy;

        p.alpha -=
            p.decay;

        if (
            p.alpha <= 0
        ) {

            particles.splice(
                i,
                1
            );

            continue;
        }

        ctx.save();

        ctx.globalAlpha =
            p.alpha;

        ctx.fillStyle =
            p.color;

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.radius,
            0,
            Math.PI * 2
        );

        ctx.fill();

        ctx.restore();
    }

    /*
        判定文字
    */
    for (
        let i =
            floatingTexts.length - 1;
        i >= 0;
        i--
    ) {

        const ft =
            floatingTexts[i];

        ft.timer--;

        const progressRate =
            1 -
            ft.timer /
            ft.maxTime;

        const floatY =
            -Math.sin(
                progressRate *
                Math.PI
            ) *
            25;

        const alpha =
            ft.timer < 8
            ?
            ft.timer / 8
            :
            1;

        ctx.save();

        ctx.globalAlpha =
            alpha;

        ctx.translate(
            ft.x,
            ft.y +
            floatY
        );

        ctx.fillStyle =
            ft.color;

        ctx.font =
            "bold 20px 'Darumadrop One', 'RocknRoll One', sans-serif";

        ctx.textAlign =
            "center";

        ctx.textBaseline =
            "middle";

        ctx.lineWidth =
            4;

        ctx.strokeStyle =
            "#fffdf9";

        ctx.strokeText(
            ft.text,
            0,
            0
        );

        ctx.fillText(
            ft.text,
            0,
            0
        );

        ctx.restore();

        if (
            ft.timer <= 0
        ) {

            floatingTexts.splice(
                i,
                1
            );
        }
    }

    requestAnimationFrame(
        gameLoop
    );
}
