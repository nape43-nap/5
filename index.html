<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, user-scalable=no"
>

<title>絵本風リズムゲーム</title>

<link
    href="https://fonts.googleapis.com/css2?family=Darumadrop+One&family=RocknRoll+One&display=swap"
    rel="stylesheet"
>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;
    padding: 0;

    background: #fdfbf7;

    font-family:
        'RocknRoll One',
        sans-serif;

    display: flex;

    justify-content: center;
    align-items: center;

    width: 100vw;
    height: 100vh;

    overflow: hidden;

    touch-action: none;

    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
}

.en-font {

    font-family:
        'Darumadrop One',
        cursive,
        sans-serif;
}

#game-container {

    position: relative;

    width: 100vw;
    height: 100vh;

    max-width: 450px;
    max-height: 800px;

    background: #fffdf9;

    box-shadow:
        0 10px 30px
        rgba(0,0,0,0.05);

    border-radius: 20px;

    overflow: hidden;

    border:
        8px solid
        #f0e6d2;
}

canvas {

    display: block;

    width: 100%;
    height: 100%;
}

.screen {

    position: absolute;

    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    background:
        rgba(253,251,247,0.98);

    display: flex;

    flex-direction: column;

    justify-content: center;
    align-items: center;

    z-index: 10;

    padding: 20px;
}

.hidden {

    display: none !important;
}

h1 {

    color: #7c6f64;

    font-size: 26px;

    margin-bottom: 20px;

    text-align: center;
}

.btn {

    background-color:
        #e3c4a8;

    color: #fff;

    border: none;

    padding: 14px 35px;

    font-size: 18px;

    border-radius: 30px;

    cursor: pointer;

    box-shadow:
        0 4px 15px
        rgba(227,196,168,0.4);

    margin-top: 15px;

    font-family:
        'RocknRoll One',
        sans-serif;
}

.btn:active {

    transform: scale(0.95);
}

#selector-config-btn,
#menu-btn {

    position: absolute;

    top: 15px;
    right: 15px;

    background: #fff;

    border:
        2.5px solid
        #f0e6d2;

    color: #7c6f64;

    width: 38px;
    height: 38px;

    border-radius: 50%;

    font-size: 16px;

    display: flex;

    justify-content: center;
    align-items: center;

    cursor: pointer;

    z-index: 25;
}

.song-selector-container {

    display: flex;

    flex-direction: column;

    align-items: center;

    position: relative;

    width: 100%;
}

.song-list-viewport {

    width: 330px;
    height: 280px;

    overflow: hidden;

    position: relative;

    display: flex;

    justify-content: center;
    align-items: center;

    cursor: grab;

    touch-action: none;

    mask-image:
        linear-gradient(
            to bottom,
            transparent,
            black 10%,
            black 90%,
            transparent
        );

    -webkit-mask-image:
        linear-gradient(
            to bottom,
            transparent,
            black 10%,
            black 90%,
            transparent
        );
}

.song-card {

    position: absolute;

    width: 300px;

    background: #fff;

    border:
        3px solid
        #f0e6d2;

    padding: 12px 15px;

    border-radius: 15px;

    display: flex;

    align-items: center;

    gap: 15px;

    box-shadow:
        0 4px 10px
        rgba(0,0,0,0.02);

    pointer-events: none;
}

.song-card.selected {

    border-color: #d4a373;

    background: #fffcf7;
}

.song-jacket {

    width: 50px;
    height: 50px;

    border-radius: 10px;

    background: #f7f2ea;

    display: flex;

    justify-content: center;
    align-items: center;

    font-size: 24px;

    flex-shrink: 0;

    overflow: hidden;
}

.song-jacket img {

    width: 100%;
    height: 100%;

    object-fit: cover;
}

.song-info {

    display: flex;

    flex-direction: column;

    gap: 4px;

    min-width: 0;
}

.song-title {

    font-weight: bold;

    color: #7c6f64;

    font-size: 15px;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}

.song-artist {

    font-size: 12px;

    color: #b8aea1;
}

.song-difficulty {

    font-size: 10px;

    color: #d4a373;
}

.cloud-highscore {

    position: absolute;

    top: 162px;
    right: 18px;

    background: #fff;

    border:
        2.5px solid
        #f0e6d2;

    padding: 4px 8px;

    border-radius: 15px;

    display: flex;

    align-items: center;

    gap: 6px;

    z-index: 15;
}

.cloud-rank-box {

    width: 24px;
    height: 24px;

    background: #fdfbf7;

    border:
        2px solid
        #e3c4a8;

    border-radius: 50%;

    display: flex;

    justify-content: center;
    align-items: center;

    color: #d4a373;

    font-weight: bold;
}

.cloud-info {

    display: flex;

    flex-direction: column;
}

.cloud-label {

    font-size: 7px;

    color: #b8aea1;
}

.cloud-score-val {

    font-size: 13px;

    color: #7c6f64;

    font-weight: bold;
}

.credit-jacket-large {

    width: 130px;
    height: 130px;

    border-radius: 25px;

    background: #fff;

    border:
        4px solid
        #f0e6d2;

    display: flex;

    justify-content: center;
    align-items: center;

    font-size: 60px;

    margin-bottom: 20px;

    overflow: hidden;
}

.credit-jacket-large img {

    width: 100%;
    height: 100%;

}

.credit-title {

    font-weight: bold;

}

.credit-artist {

    font-size: 14px;

    color: #b8aea1;

    margin-bottom: 30px;
}

.ready-text {

    font-size: 22px;

    color: #d4a373;

    font-weight: bold;
}

#score-board {

    position: absolute;

    top: 20px;
    left: 0;

    width: 100%;

    text-align: center;

    color: #7c6f64;

    font-size: 20px;

    font-weight: bold;

    pointer-events: none;

}

.pause-panel,
.modal-panel,
.result-panel {

    background: #fff;

    border:
        3px solid
        #f0e6d2;

    border-radius: 20px;

    box-shadow:
        0 6px 20px

}

.pause-panel {

    width: 100%;

    max-width: 300px;

    padding: 25px 20px;

    text-align: center;

    display: flex;

    flex-direction: column;

    gap: 12px;
}

.pause-title,
.modal-title {

    font-size: 20px;

    color: #7c6f64;

    font-weight: bold;
}

.pause-btn {

    background: #f7f2ea;

    color: #7c6f64;

    border:
        2px solid
        #f0e6d2;

    padding: 12px;

    font-size: 16px;

    font-family:
        'RocknRoll One',
        sans-serif;

    font-weight: bold;
}

.pause-btn.primary {

    background: #e3c4a8;

}

.modal-panel {

}

.modal-body {

    font-size: 13px;

    color: #7c6f64;

}

.setting-item {

    background: #fffcf7;

    border:
        2px solid
        #f5efe6;

    padding: 12px;

    border-radius: 12px;
}

.setting-label {

    font-size: 14px;

    font-weight: bold;

    color: #7c6f64;

    display: flex;

    justify-content: space-between;
}

.setting-range-container {

    display: flex;

    align-items: center;

    gap: 10px;
}

input[type="range"] {

    flex: 1;

    accent-color: #d4a373;
}

.result-panel {

    width: 100%;

    max-width: 330px;

    padding: 16px;

}

.rank-badge {

    position: absolute;

    top: -20px;

    right: 20px;

    height: 55px;

    background: #e3c4a8;

    color: #fff;

    font-size: 26px;

    display: flex;

    justify-content: center;
    align-items: center;

    border-radius: 50%;
}

.result-song-header {

    display: flex;

    align-items: center;

    gap: 12px;

    margin-bottom: 10px;
}

.result-jacket-small {

    width: 45px;
    height: 45px;

    background: #f7f2ea;

    display: flex;

    justify-content: center;
    align-items: center;

    font-size: 22px;

}

.result-jacket-small img {

    width: 100%;
    height: 100%;

    object-fit: cover;
}

.result-song-meta {

    display: flex;

    flex-direction: column;
}

.result-title-text {

    font-weight: bold;

    color: #7c6f64;
}

.result-artist-text {

    font-size: 11px;

    color: #b8aea1;
}

.result-score-container {

    text-align: center;

    margin-bottom: 10px;
}

.result-score-val {

    font-size: 28px;

    font-weight: bold;

    color: #d4a373;
}

.judge-stats {

    display: flex;

    flex-direction: column;

    gap: 4px;
}

.judge-row {

    display: flex;

    justify-content: space-between;

    padding: 0 10px;

    font-size: 13px;

    font-weight: bold;
}

.stat-label-kirari {
    color: #f1c40f;
}

.stat-label-suteki {
    color: #e67e22;
}

.stat-label-ii {
    color: #3498db;
}

.stat-label-alara {
    color: #95a5a6;
}

.result-btn-container {

    display: flex;

    gap: 10px;

    width: 100%;

    max-width: 330px;
}

.result-btn {

    flex: 1;

    border: none;

    padding: 12px 0;

    font-size: 16px;

    border-radius: 30px;

    margin-top: 12px;

    background: #e3c4a8;

    color: #fff;

    font-family:
        'RocknRoll One',
        sans-serif;
}

.result-btn.sub {

    background: #f7f2ea;

    color: #7c6f64;

    border:
        2px solid
        #f0e6d2;
}

</style>

</head>


<body>

<div id="game-container">


<div id="score-board">

    </span>

</div>

===================================================== -->

        </div>

            <div

<!-- =====================================================

    <div

    <div

<script>

/* =========================================================
   Canvas
========================================================= */

const canvas =
    document.getElementById(
        "gameCanvas"
    );

const ctx =
    canvas.getContext("2d");


function resizeCanvas() {

    canvas.width =
        canvas.parentElement.clientWidth;

    canvas.height =
        canvas.parentElement.clientHeight;
}


window.addEventListener(
    "resize",
    resizeCanvas
);

resizeCanvas();


/* =========================================================
   女の子
========================================================= */

const girlImg =
    new Image();

girlImg.src =
    "girl.png";


/* =========================================================
   ゲーム状態
========================================================= */

let gameState =
    "SELECT";

let score =
    0;

let audioCtx =
    null;

let musicAudio =
    null;

let startTime =
    0;

let totalPausedTime =
    0;

let pauseStartTime =
    0;

let songDuration =
    15;

let chartEndTime =
    0;


/* =========================================================
   ノーツ速度
========================================================= */

let noteSpeedMultiplier =
    parseFloat(
        localStorage.getItem(
            "rhythm_game_speed"
        )
    ) || 1.0;


const baseNoteSpeed =
    2.8;


const targetRadius =
    32;


/* =========================================================
   曲データ
========================================================= */

let songs = [];

let currentSongIndex = 0;

let currentSong = null;


/* =========================================================
   index.json読み込み
========================================================= */

async function loadSongIndex() {

    try {

        const response =
            await fetch(
                "songs/index.json?t=" +
                Date.now()
            );


        if (!response.ok) {

            throw new Error(
                "songs/index.json HTTP " +
                response.status
            );
        }


        const data =
            await response.json();


        if (
            !data.songs ||
            !Array.isArray(data.songs)
        ) {

            throw new Error(
                "index.json の songs が配列ではありません"
            );
        }


        songs =
            data.songs.map(
                item => {

                    /*
                        文字列形式
                    */

                    if (
                        typeof item === "string"
                    ) {

                        return {

                            id: item,

                            title: item,

                            artist: "",

                            jacket: "🎵",

                            audioSrc:
                                "songs/" +
                                item +
                                "/audio.mp3",

                            chartFile:
                                "songs/" +
                                item +
                                "/chart.js",

                            difficulty: "",

                            level: ""
                        };
                    }


                    /*
                        オブジェクト形式
                    */

                    const id =
                        item.id ||
                        item.name;


                    return {

                        id: id,

                        title:
                            item.title ||
                            id,

                        artist:
                            item.artist ||
                            "",

                        jacket:
                            item.jacket ||
                            "🎵",

                        audioSrc:
                            item.audio ||
                            item.audioSrc ||
                            (
                                "songs/" +
                                id +
                                "/audio.mp3"
                            ),

                        chartFile:
                            item.chart ||
                            item.chartFile ||
                            (
                                "songs/" +
                                id +
                                "/chart.js"
                            ),

                        difficulty:
                            item.difficulty ||
                            "",

                        level:
                            item.level ??
                            "",

                        difficulties:
                            item.difficulties ||
                            null
                    };
                }
            );


        console.log(
            "================================"
        );

        console.log(
            "曲一覧読み込み成功"
        );

        console.log(
            songs
        );

        console.log(
            "================================"
        );


        if (
            songs.length === 0
        ) {

            throw new Error(
                "曲が1曲もありません"
            );
        }


        renderSongSelector();


    } catch (error) {

        console.error(
            "曲一覧読み込みエラー:",
            error
        );


        alert(
            "曲一覧を読み込めませんでした。\n\n" +
            error.message
        );
    }
}


/* =========================================================
   外部JS譜面読み込み
   songs/曲ID/chart.js に自動対応
========================================================= */

async function loadExternalChart(song) {

    if (!song || !song.id) {

        console.error(
            "loadExternalChart: song または song.id がありません",
            song
        );

        return null;
    }


    /*
        -----------------------------------------------------
        譜面ファイルの場所を決定
        -----------------------------------------------------

        index.json に chartFile があればそれを使用。

        なければ、

        songs/sample/chart.js
        songs/donguri-korokoro/chart.js

        のように自動生成。
    */

    const chartFile =
        song.chartFile ||
        `songs/${song.id}/chart.js`;


    console.log(
        "譜面読み込み開始:",
        chartFile
    );


    return new Promise(
        (resolve, reject) => {


            /*
                -------------------------------------------------
                前回読み込んだ chart.js を削除
                -------------------------------------------------
            */

            const oldScript =
                document.getElementById(
                    "external-chart-script"
                );


            if (oldScript) {

                oldScript.remove();
            }


            /*
                -------------------------------------------------
                古いデータをクリア

            */

            window.chart =

            window.sample =
                null;


            /*
                -------------------------------------------------
                今回の曲用データ名
                -------------------------------------------------

                sample
                ↓
                songData_sample

                donguri-korokoro
                ↓
                songData_donguri-korokoro

                ただし、

                window["songData_donguri-korokoro"]

                のようにブラケット記法なら問題ありません。
            */

            const songDataName =
                "songData_" +
                song.id;


            /*
                読み込み前に一旦消す
            */

            window[
                songDataName
            ] =
                null;


            /*
                -------------------------------------------------
                script生成
                -------------------------------------------------
            */

            const script =
                document.createElement(
                    "script"
                );


            script.id =
                "external-chart-script";


            /*
                キャッシュ対策
            */

            script.src =
                chartFile +
                "?t=" +
                Date.now();


            /*
                -------------------------------------------------
                読み込み成功
                -------------------------------------------------
            */

            script.onload =
                () => {

                    console.log(
                        "================================"
                    );

                    console.log(
                        "chart.js読み込み成功"
                    );

                    console.log(
                        "読み込み先:",
                        chartFile
                    );

                    console.log(
                        "探しているデータ:",
                        songDataName
                    );

                    console.log(
                        "================================"
                    );


                    /*
                        -------------------------------------------------
                        ① 正式形式

                        window.songData_sample
                        -------------------------------------------------
                    */

                    const songData =
                        window[
                            songDataName
                        ];


                    if (
                        songData
                    ) {

                        console.log(
                            "曲データ読み込み成功:",
                            songData
                        );


                        /*
                            audioSrcがchart.jsにある場合
                            曲データへ反映
                        */

                        if (
                            songData.audioSrc
                        ) {

                            song.audioSrc =
                                songData.audioSrc;
                        }


                        /*
                            duration
                        */

                        if (
                            songData.duration
                        ) {

                            song.chartDuration =
                                Number(
                                    songData.duration
                                );
                        }


                        console.log(
                            "音源:",
                            song.audioSrc
                        );


                        console.log(
                            "譜面数:",
                            Array.isArray(
                                songData.chart
                            )
                            ?
                            songData.chart.length
                            :
                            0
                        );


                        resolve(
                            songData
                        );


                        return;
                    }


                    /*
                        -------------------------------------------------
                        ② window.chart形式
                        -------------------------------------------------
                    */

                    if (
                        window.chart
                    ) {

                        console.log(
                            "window.chart形式で読み込み成功:",
                            window.chart
                        );


                        resolve(
                            window.chart
                        );


                        return;
                    }


                    /*
                        -------------------------------------------------
                        ③ window.sample形式
                        -------------------------------------------------
                    */

                    if (
                        window.sample
                    ) {

                        console.log(
                            "window.sample形式で読み込み成功:",
                            window.sample
                        );


                        resolve(
                            window.sample
                        );


                        return;
                    }


                    /*
                        -------------------------------------------------
                        ④ chart.js内のデータを自動検索
                        
                        念のための保険。

                        window.songData_xxx
                        という形式なら、IDが多少違っても
                        見つけられるようにする。
                        -------------------------------------------------
                    */

                    let foundData =
                        null;


                    const prefix =
                        "songData_";


                    for (
                        const key of
                        Object.keys(
                            window
                        )
                    ) {

                        if (
                            key.startsWith(
                                prefix
                            )
                        ) {

                            const value =
                                window[key];


                            if (
                                value &&
                                typeof value ===
                                "object" &&
                                Array.isArray(
                                    value.chart
                                )
                            ) {

                                foundData =
                                    value;


                                console.log(
                                    "songDataを自動検出:",
                                    key
                                );


                                break;
                            }
                        }
                    }


                    if (
                        foundData
                    ) {

                        /*
                            自動検出したデータを
                            現在の曲へ反映
                        */

                        if (
                            foundData.audioSrc
                        ) {

                            song.audioSrc =
                                foundData.audioSrc;
                        }


                        if (
                            foundData.duration
                        ) {

                            song.chartDuration =
                                Number(
                                    foundData.duration
                                );
                        }


                        resolve(
                            foundData
                        );


                        return;
                    }


                    /*
                        -------------------------------------------------
                        ⑤ どうしても見つからない
                        -------------------------------------------------
                    */

                    console.error(
                        "chart.jsは読み込めましたが、曲データが見つかりません。"
                    );


                    console.error(
                        "探していた名前:",
                        songDataName
                    );


                    console.error(
                        "現在のsong:",
                        song
                    );


                    reject(
                        new Error(

                            "chart.js は読み込めましたが、\n" +

                            songDataName +

                            " が見つかりません。\n\n" +

                            "読み込み先:\n" +

                            chartFile

                        )
                    );
                };


            /*
                -------------------------------------------------
                読み込み失敗
                -------------------------------------------------
            */

            script.onerror =
                () => {

                    console.error(
                        "譜面ファイルを読み込めません:"
                    );

                    console.error(
                        chartFile
                    );


                    reject(

                        new Error(

                            "譜面ファイルを読み込めません。\n\n" +

                            "読み込み先:\n" +

                            chartFile

                        )

                    );
                };


            /*
                -------------------------------------------------
                scriptをページへ追加
                -------------------------------------------------
            */

            document.body.appendChild(
                script
            );

        }
    );
}

/* =========================================================
   譜面終了時間
========================================================= */

function calculateChartEndTime(
    chart
) {

    if (
        !chart ||
        chart.length === 0
    ) {

        return 5;
    }


    let maxTime =
        0;


    for (
        const note of chart
    ) {

        let endTime =
            Number(
                note.time
            ) || 0;


        /*
            LONG
        */

        if (
            note.type ===
            "long"
        ) {

            endTime +=
                Number(
                    note.duration
                ) || 0;
        }


        /*
            SLIDE
        */

        if (
            note.type ===
                "slidenode" ||

            note.type ===
                "slide"
        ) {

            endTime +=
                Number(
                    note.slideDuration ||
                    note.pathTime ||
                    note.duration ||
                    0
                );
        }


        if (
            endTime >
            maxTime
        ) {

            maxTime =
                endTime;
        }
    }


    return (
        maxTime +
        1.5
    );
}


/* =========================================================
   譜面生成
========================================================= */

function generateChart(
    chartData
) {

    notes = [];

    particles = [];

    floatingTexts = [];


    if (
        !Array.isArray(
            chartData
        )
    ) {

        console.error(
            "chartDataが配列ではありません:",
            chartData
        );

        chartData = [];
    }


    notes =
        chartData.map(
            note => {

                let normalizedType =
                    note.type ||
                    "tap";


                /*
                    slide → slidenode
                */

                if (
                    normalizedType ===
                    "slide"
                ) {

                    normalizedType =
                        "slidenode";
                }


                return {

                    ...note,

                    time:
                        Number(
                            note.time
                        ) || 0,

                    lane:
                        Number(
                            note.lane
                        ) || 0,

                    type:
                        normalizedType,

                    duration:
                        Number(
                            note.duration
                        ) || 0,

                    hit:
                        false,

                    holding:
                        false,

                    started:
                        false,

                    assignedTouchId:
                        null
                };
            }
        );


    chartEndTime =
        calculateChartEndTime(
            notes
        );


    songDuration =
        chartEndTime;


    /*
        chart.js側にdurationがあれば
        そちらも考慮
    */

    if (
        currentSong &&
        currentSong.chartDuration
    ) {

        songDuration =
            Math.max(
                songDuration,
                currentSong.chartDuration
            );
    }


    console.log(
        "================================"
    );

    console.log(
        "譜面生成成功"
    );

    console.log(
        "ノーツ数:",
        notes.length
    );

    console.log(
        "譜面終了時間:",
        songDuration
    );

    console.log(
        notes
    );

    console.log(
        "================================"
    );
}


/* =========================================================
   レーン
========================================================= */

function getLanePositions() {

    let positions = [];

    let centerX =
        canvas.width / 2;

    let baseY =
        canvas.height * 0.62;

    let totalWidth =
        canvas.width * 0.76;

    let spacing =
        totalWidth / 4;


    for (
        let i = 0;
        i < 5;
        i++
    ) {

        let x =
            centerX -
            totalWidth / 2 +
            spacing * i;


        let offsetY =
            -Math.pow(
                i - 2,
                2
            ) * 12 +
            25;


        let y =
            baseY +
            offsetY;


        positions.push({

            x: x,

            y: y
        });
    }


    return positions;
}

function getSongHighScore(
    id
) {

    const saved =
        localStorage.getItem(
            "rhythm_game_hs_" +
            id
        );


    return saved
        ? JSON.parse(saved)
        : {

            score: 0,

            accuracy: 0,

            rank: "-"
        };
}


function saveSongHighScore(
    id,
    newScore,
    accuracy,
    rank
) {

    const current =
        getSongHighScore(
            id
        );


    if (
        accuracy >
        current.accuracy ||

        (
            accuracy ===
            current.accuracy &&

            newScore >=
            current.score
        )
    ) {

        localStorage.setItem(

            "rhythm_game_hs_" +
            id,

            JSON.stringify({

                score:
                    newScore,

                accuracy:
                    accuracy,

                rank:
                    rank
            })
        );
    }
}

let dragStartY =
    0;

let dragCurrentOffset =
    0;

let isDragging =
    false;

const itemHeight =
    75;


function updateSelectorHighScoreDisplay() {

        !songs.length

function createJacketHTML(
    jacket
) {

    if (
        typeof jacket ===
        "string" &&

        (
            jacket.endsWith(
                ".png"
            ) ||

            jacket.endsWith(
                ".jpg"
            ) ||

            jacket.endsWith(
                ".jpeg"
            ) ||

            jacket.endsWith(
                ".webp"
            )
        )
    ) {

        return `
            <img
                src="${jacket}"
                onerror="
                    this.style.display='none';
                    this.parentElement.innerText='🎵';
                "
            >
        `;
    }


    return jacket || "🎵";
}


function renderSongSelector() {

    const viewport =
        document.getElementById(
            "song-viewport"
        );


    if (!viewport) return;


    viewport.innerHTML =
        "";


    if (
        songs.length === 0
    ) {

        return;
    }


    for (
        let i = -2;
        i <= 2;
        i++
    ) {

        const targetIdx =
            (
                currentSongIndex +
                i +
                songs.length * 10
            ) %
            songs.length;


        const song =
            songs[
                targetIdx
            ];


        const card =
            document.createElement(
                "div"
            );


        card.className =
            "song-card";


        if (
            i === 0 &&
            dragCurrentOffset === 0
        ) {

            card.classList.add(
                "selected"
            );
        }


        const totalY =
            i *
            itemHeight +
            dragCurrentOffset;


        const normY =
            totalY /
            itemHeight;


        const scale =
            Math.max(
                0.75,
                1 -
                Math.abs(
                    normY
                ) *
                0.15
            );


        const opacity =
            Math.max(
                0.15,
                1 -
                Math.abs(
                    normY
                ) *
                0.35
            );


        card.style.transform =
            `translateY(${totalY}px) scale(${scale})`;


        card.style.opacity =
            opacity;


        card.style.zIndex =
            3 -
            Math.abs(i);


        let difficultyText =
            "";


        if (
            song.difficulty
        ) {

            difficultyText =
                song.difficulty +
                (
                    song.level !== "" &&
                    song.level !== null
                    ?
                    " ★" +
                    song.level
                    :
                    ""
                );
        }


        card.innerHTML = `

            <div class="song-jacket">
                ${
                    createJacketHTML(
                        song.jacket
                    )
                }
            </div>

            <div class="song-info">

                <div class="song-title">
                    ${
                        song.title ||
                        song.id
                    }
                </div>

                <div class="song-artist">
                    ${
                        song.artist ||
                        ""
                    }
                </div>

                ${
                    difficultyText
                    ?
                    `
                    <div class="song-difficulty">
                        ${difficultyText}
                    </div>
                    `
                    :
                    ""
                }

            </div>
        `;


        viewport.appendChild(
            card
        );
    }


    updateSelectorHighScoreDisplay();
}


const viewportEl =
    document.getElementById(
        "song-viewport"
    );


viewportEl.addEventListener(
    "pointerdown",
    e => {

        if (
            gameState !==
            "SELECT"
        ) return;


        isDragging =
            true;


        dragStartY =
            e.clientY;


        dragCurrentOffset =
            0;


        viewportEl.setPointerCapture(
            e.pointerId
        );
    }
);


viewportEl.addEventListener(
    "pointermove",
    e => {

        if (
            !isDragging ||
            gameState !==
            "SELECT"
        ) return;


        let diffY =
            e.clientY -
            dragStartY;


        dragCurrentOffset =
            diffY;


        while (
            Math.abs(
                dragCurrentOffset
            ) >= itemHeight
        ) {

            if (
                dragCurrentOffset >
                0
            ) {

                currentSongIndex =
                    (
                        currentSongIndex -
                        1 +
                        songs.length
                    ) %
                    songs.length;


                dragStartY +=
                    itemHeight;


                dragCurrentOffset -=
                    itemHeight;

            } else {

                currentSongIndex =
                    (
                        currentSongIndex +
                        1
                    ) %
                    songs.length;


                dragStartY -=
                    itemHeight;


                dragCurrentOffset +=
                    itemHeight;
            }
        }


        renderSongSelector();
    }
);


function handleDragEnd(e) {

    if (
        !isDragging
    ) return;


    isDragging =
        false;


    const snapSteps =
        Math.round(
            dragCurrentOffset /
            itemHeight
        );


    currentSongIndex =
        (
            currentSongIndex -
            snapSteps +
            songs.length * 10
        ) %
        songs.length;


    dragCurrentOffset =
        0;


    renderSongSelector();


    try {

        viewportEl.releasePointerCapture(
            e.pointerId
        );

    } catch {}
}


viewportEl.addEventListener(
    "pointerup",
    handleDragEnd
);


viewportEl.addEventListener(
    "pointercancel",
    handleDragEnd
);

/* =========================================================
   実際のゲーム開始
========================================================= */

async function startActualGame(
    song
) {

    if (
        !song
    ) return;


    currentSong =
        song;


    /*
        -----------------------------------------------------
        前の音源停止
        -----------------------------------------------------
    */

    if (
        musicAudio
    ) {

        try {

            musicAudio.pause();

            musicAudio.currentTime =
                0;

        } catch (
            error
        ) {

            console.warn(
                "前の音源停止エラー:",
                error
            );
        }


        musicAudio =
            null;
    }


    /*
        -----------------------------------------------------
        譜面読み込み
        -----------------------------------------------------
    */

    let externalData =
        null;


    try {

        externalData =
            await loadExternalChart(
                song
            );

    } catch (
        error
    ) {

        console.error(
            "================================"
        );

        console.error(
            "譜面読み込み失敗"
        );

        console.error(
            error
        );

        console.error(
            "================================"
        );


        alert(
            "譜面ファイルを読み込めませんでした。\n\n" +
            error.message
        );


        returnToSelectFromPause();

        return;
    }


    /*
        -----------------------------------------------------
        chart.jsのデータをcurrentSongへ反映
        -----------------------------------------------------
    */

    if (
        externalData
    ) {

        if (
            externalData.audioSrc
        ) {

            song.audioSrc =
                externalData.audioSrc;
        }


        if (
            externalData.duration
        ) {

            song.chartDuration =
                Number(
                    externalData.duration
                );
        }


        if (
            externalData.jacket
        ) {

            song.jacket =
                externalData.jacket;
        }


        if (
            externalData.title
        ) {

            song.title =
                externalData.title;
        }


        if (
            externalData.artist
        ) {

            song.artist =
                externalData.artist;
        }


        generateChart(
            externalData.chart ||
            []
        );

    } else {

        generateChart(
            []
        );
    }


    /*
        -----------------------------------------------------
        MP3
        -----------------------------------------------------
    */

    musicAudio =
        new Audio();


    musicAudio.src =
        song.audioSrc;


    musicAudio.preload =
        "auto";


    musicAudio.loop =
        false;


    musicAudio.onerror =
        () => {

            console.warn(
                "音源を読み込めません:",
                song.audioSrc
            );
        };


    /*
        -----------------------------------------------------
        ゲーム初期化
        -----------------------------------------------------
    */

    score =
        0;


    totalPausedTime =
        0;


    pauseStartTime =
        0;


    activeTouches.clear();


    judgeCounts = {

        kirari:
            0,

        suteki:
            0,

        ii:
            0,

        alara:
            0
    };


    scoreBoardUpdate();


    /*
        READY画面を閉じる
    */

    document.getElementById(
        "credit-screen"
    ).classList.add(
        "hidden"
    );


    /*
        メニューボタン表示
    */

    document.getElementById(
        "menu-btn"
    ).classList.remove(
        "hidden"
    );


    /*
        -----------------------------------------------------
        AudioContext準備
        -----------------------------------------------------
    */

    if (
        !audioCtx
    ) {

        audioCtx =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();
    }


    if (
        audioCtx.state ===
        "suspended"
    ) {

        try {

            await audioCtx.resume();

        } catch (
            error
        ) {

            console.warn(
                "AudioContext resume失敗:",
                error
            );
        }
    }


    /*
        -----------------------------------------------------
        MP3読み込み準備
        -----------------------------------------------------
        
        「ゲーム時計だけ進んでいるのに
         音楽がまだ鳴っていない」
        
        という状態を防ぎます。
    */

    try {

        await new Promise(
            (
                resolve,
                reject
            ) => {

                /*
                    すでに再生可能なら
                    そのまま進む
                */

                if (
                    musicAudio.readyState >=
                    3
                ) {

                    resolve();

                    return;
                }


                const onReady =
                    () => {

                        cleanup();

                        resolve();
                    };


                const onError =
                    () => {

                        cleanup();

                        reject(
                            new Error(
                                "MP3の読み込みに失敗しました"
                            )
                        );
                    };


                const cleanup =
                    () => {

                        musicAudio.removeEventListener(
                            "canplaythrough",
                            onReady
                        );

                        musicAudio.removeEventListener(
                            "error",
                            onError
                        );
                    };


                musicAudio.addEventListener(
                    "canplaythrough",
                    onReady
                );


                musicAudio.addEventListener(
                    "error",
                    onError
                );


                /*
                    読み込み開始
                */

                musicAudio.load();
            }
        );

    } catch (
        error
    ) {

        console.warn(
            "MP3準備失敗:",
            error
        );


        alert(
            "音源を読み込めませんでした。\n\n" +
            song.audioSrc
        );


        returnToSelectFromPause();

        return;
    }


    /*
        -----------------------------------------------------
        ここが超重要
        -----------------------------------------------------
        
        ゲーム時計を先に開始しません。
        
        まずMP3を再生します。
    */

    try {

        await musicAudio.play();

    } catch (
        error
    ) {

        console.warn(
            "MP3再生に失敗:",
            error
        );


        alert(
            "音楽を再生できませんでした。\n\n" +
            "もう一度曲を選択してください。"
        );


        returnToSelectFromPause();

        return;
    }


    /*
        -----------------------------------------------------
        MP3再生開始
        -----------------------------------------------------
        
        ここからゲーム開始。
        
        今後のゲーム時間は
        musicAudio.currentTime
        を使用します。
    */

    startTime =
        performance.now();


    totalPausedTime =
        0;


    pauseStartTime =
        0;


    gameState =
        "PLAYING";


    console.log(
        "================================"
    );

    console.log(
        "ゲーム開始"
    );

    console.log(
        "MP3:",
        song.audioSrc
    );

    console.log(
        "MP3 currentTime:",
        musicAudio.currentTime
    );

    console.log(
        "================================"
    );
}

        "pause-screen"
    ).classList.add(
        "hidden"
    );


    totalPausedTime +=
        audioCtx.currentTime -
        pauseStartTime;


    if (
        musicAudio

        musicAudio.play().catch(

    gameState =
        "PLAYING";

/* =========================================================
   RESULT
========================================================= */

function finishGame() {

    gameState =
        "RESULT";


    if (
        musicAudio
    ) {

        musicAudio.pause();

        musicAudio.currentTime =
            0;
    }


    document.getElementById(
        "menu-btn"
    ).classList.add(
        "hidden"
    );


    const song =
        currentSong ||
        songs[
            currentSongIndex
        ];


    const resultJacket =
        document.getElementById(
            "result-jacket-icon"
        );


    if (
        typeof song.jacket ===
        "string" &&

        (
            song.jacket.endsWith(
                ".png"
            ) ||

            song.jacket.endsWith(
                ".jpg"
            ) ||

            song.jacket.endsWith(
                ".jpeg"
            ) ||

            song.jacket.endsWith(
                ".webp"
            )
        )
    ) {

        resultJacket.innerHTML =
            `
            <img
                src="${song.jacket}"
                onerror="
                    this.style.display='none';
                    this.parentElement.innerText='🎵';
                "
            >
            `;

    } else {

        resultJacket.innerText =
            song.jacket ||
            "🎵";
    }


    document.getElementById(
        "result-song-title"
    ).innerText =
        song.title ||
        song.id;


    document.getElementById(
        "result-song-artist"
    ).innerText =
        song.artist ||
        "";


    document.getElementById(
        "final-score"
    ).innerText =
        score;


    document.getElementById(
        "count-kirari"
    ).innerText =
        judgeCounts.kirari;


    document.getElementById(
        "count-suteki"
    ).innerText =
        judgeCounts.suteki;


    document.getElementById(
        "count-ii"
    ).innerText =
        judgeCounts.ii;


    document.getElementById(
        "count-alara"
    ).innerText =
        judgeCounts.alara;


    const total =
        judgeCounts.kirari +
        judgeCounts.suteki +
        judgeCounts.ii +
        judgeCounts.alara;


    const accuracy =
        total > 0
        ?
        judgeCounts.kirari /
        total *
        100
        :
        0;


    let rank =
        "D";


    if (
        judgeCounts.suteki === 0 &&
        judgeCounts.ii === 0 &&
        judgeCounts.alara === 0 &&
        total > 0
    ) {

        rank =
            "SSS";

    } else if (
        accuracy >= 90
    ) {

        rank =
            "SS";

    } else if (
        accuracy >= 80
    ) {

        rank =
            "S";

    } else if (
        accuracy >= 60
    ) {

        rank =
            "A";

    } else if (
        accuracy >= 40
    ) {

        rank =
            "B";

    } else if (
        accuracy >= 20
    ) {

        rank =
            "C";
    }


    document.getElementById(
        "result-rank"
    ).innerText =
        rank;


    saveSongHighScore(
        song.id,
        score,
        accuracy,
        rank
    );


    document.getElementById(
        "result-screen"
    ).classList.remove(
        "hidden"
    );
}

/* =========================================================
   エフェクト
========================================================= */

function spawnParticles(
    x,
    y,
    color
) {

    for (
        let i = 0;
        i < 10;
        i++
    ) {

        const angle =
            Math.random() *
            Math.PI *
            2;


        const speed =
            2 +
            Math.random() *
            4;


        particles.push({

            x: x,

            y: y,

            vx:
                Math.cos(angle) *
                speed,

            vy:
                Math.sin(angle) *
                speed,

            radius:
                3 +
                Math.random() *
                4,

            color:
                color,

            alpha:
                1,

            decay:
                0.04 +
                Math.random() *
                0.04
        });
    }
}


function showFloatingText(
    text,
    color,
    x,
    y
) {

    floatingTexts.push({

        text:
            text,

        color:
            color,

        x:
            x,

        y:
            y,

        timer:
            25,

        maxTime:
            25
    });
}

function judgeAction(
    diff,
    x,
    y
) {

    if (
        diff < 0.09
    ) {

        score +=
            300;

        judgeCounts.kirari++;


        showFloatingText(
            "ｷﾗﾘ!",

            x,

        );

    } else if (
        diff < 0.22
    ) {

        score +=
