<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>絵本風リズムゲーム - MIDI譜面コンバーター</title>
    <link href="https://fonts.googleapis.com/css2?family=Darumadrop+One&family=RocknRoll+One&display=swap" rel="stylesheet">
    <!-- Tone.js と @tonejs/midi の読み込み -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <script src="https://unpkg.com/@tonejs/midi@2.0.28/build/Midi.js"></script>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #fdfbf7;
            font-family: 'RocknRoll One', sans-serif;
            color: #7c6f64;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: #fff;
            border: 4px solid #f0e6d2;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.04);
            box-sizing: border-box;
        }
        h1 { font-size: 22px; text-align: center; margin-bottom: 20px; color: #7c6f64; }
        .form-group {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        label { font-size: 14px; font-weight: bold; }
        input[type="text"], input[type="file"] {
            padding: 10px;
            border: 2px solid #f0e6d2;
            border-radius: 10px;
            font-family: 'RocknRoll One', sans-serif;
            font-size: 14px;
            outline: none;
            background: #fffcf7;
        }
        .btn {
            background-color: #e3c4a8;
            color: #fff;
            border: none;
            padding: 14px;
            font-size: 16px;
            border-radius: 25px;
            cursor: pointer;
            font-family: 'RocknRoll One', sans-serif;
            width: 100%;
            margin-top: 10px;
            box-shadow: 0 4px 12px rgba(227, 196, 168, 0.4);
            transition: 0.2s;
        }
        .btn:active { transform: scale(0.97); }
        textarea {
            width: 100%;
            height: 200px;
            margin-top: 15px;
            border: 2px solid #f0e6d2;
            border-radius: 10px;
            padding: 10px;
            font-family: monospace;
            font-size: 12px;
            background: #fffcf7;
            box-sizing: border-box;
            resize: vertical;
        }
        .note-rule {
            font-size: 12px;
            background: #fffcf7;
            border: 2px solid #f5efe6;
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 15px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>MIDI 譜面コンバーター</h1>
    
    <div class="note-rule">
        <strong>📌 MIDI音程の割り当てルール:</strong><br>
        ・ <strong>C3 (ド) 〜 G3</strong>：通常のタップノーツ<br>
        ・ <strong>C3の長さがある音</strong>：ロングノーツ<br>
        ・ <strong>C4 (上のド) 〜 G4</strong>：フリックノーツ (◆)<br>
        ・ <strong>C5 (さらに上のド) 〜</strong>：黄色の弧を描くロング/スライドノーツ
    </div>

    <div class="form-group">
        <label>曲ID (例: song_4)</label>
        <input type="text" id="songId" value="song_4">
    </div>
    <div class="form-group">
        <label>曲名</label>
        <input type="text" id="songTitle" value="新しい曲">
    </div>
    <div class="form-group">
        <label>アーティスト名</label>
        <input type="text" id="songArtist" value="作者名">
    </div>
    <div class="form-group">
        <label>ジャケット画像パス (例: assets/images/4.jpg または 🎵)</label>
        <input type="text" id="songJacket" value="🎵">
    </div>
    <div class="form-group">
        <label>音声ファイルパス (例: assets/audio/4.mp3)</label>
        <input type="text" id="songAudio" value="assets/audio/4.mp3">
    </div>
    <div class="form-group">
        <label>MIDIファイルを選択</label>
        <input type="file" id="midiFile" accept=".mid">
    </div>

    <button class="btn" onclick="convertMidi()">譜面データ(.js)を生成する</button>

    <textarea id="outputResult" placeholder="ここに生成されたコードが表示されます..." readonly></textarea>
</div>

<script>
async function convertMidi() {
    const fileInput = document.getElementById('midiFile');
    if (fileInput.files.length === 0) {
        alert('MIDIファイルを選択してください。');
        return;
    }

    const file = fileInput.files[0];
    const arrayBuffer = await file.arrayBuffer();
    const midi = new Midi(arrayBuffer);

    let chartNotes = [];
    let maxTime = 15; // デフォルト秒数

    midi.tracks.forEach(track => {
        track.notes.forEach(note => {
            let midiNote = note.midi; // 60 = C4, 48 = C3, 72 = C5
            let time = note.time;
            let duration = note.duration;

            if (time + duration > maxTime) {
                maxTime = Math.ceil(time + duration + 2);
            }

            // レーンの割り振り (0〜4の5レーン)
            let lane = Math.floor(((midiNote % 12) / 12) * 5);
            if (lane > 4) lane = 4;

            let type = 'tap';
            if (midiNote >= 72) {
                // C5以上：黄色の弧を描くロングノーツ
                type = 'long';
            } else if (midiNote >= 60 && midiNote < 72) {
                // C4以上：フリック
                type = 'flick';
            } else if (duration > 0.25) {
                // C3付近で長い音：ロングノーツ
                type = 'long';
            }

            chartNotes.push({
                time: parseFloat(time.toFixed(3)),
                lane: lane,
                type: type,
                duration: type === 'long' ? parseFloat(duration.toFixed(3)) : 0,
                noteName: note.name
            });
        });
    });

    // 時間順にソート
    chartNotes.sort((a, b) => a.time - b.time);

    const songData = {
        id: document.getElementById('songId').value,
        title: document.getElementById('songTitle').value,
        artist: document.getElementById('songArtist').value,
        jacket: document.getElementById('songJacket').value,
        audioSrc: document.getElementById('songAudio').value,
        duration: maxTime,
        chart: chartNotes
    };

    const outputCode = `window.${songData.id} = ${JSON.stringify(songData, null, 2)};`;
    document.getElementById('outputResult').value = outputCode;
    alert('譜面データの生成が完了しました！下部のボックスからコピーして保存してください。');
}
</script>

</body>
</html>
