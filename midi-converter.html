<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>絵本風リズムゲーム - MIDI譜面コンバーター</title>
    <link href="https://fonts.googleapis.com/css2?family=Darumadrop+One&family=RocknRoll+One&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <script src="https://unpkg.com/@tonejs/midi@2.0.28/build/Midi.js"></script>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #fdfbf7;
            font-family: 'RocknRoll One', sans-serif;
            color: #7c6f64;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: #fff;
            border: 4px solid #f0e6d2;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.04);
            box-sizing: border-box;
        }
        h1 { font-size: 22px; text-align: center; margin-bottom: 20px; color: #7c6f64; }
        .form-group {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        label { font-size: 14px; font-weight: bold; }
        input[type="text"], input[type="file"] {
            padding: 10px;
            border: 2px solid #f0e6d2;
            border-radius: 10px;
            font-family: 'RocknRoll One', sans-serif;
            font-size: 14px;
            outline: none;
            background: #fffcf7;
        }
        .btn {
            background-color: #e3c4a8;
            color: #fff;
            border: none;
            padding: 14px;
            font-size: 16px;
            border-radius: 25px;
            cursor: pointer;
            font-family: 'RocknRoll One', sans-serif;
            width: 100%;
            margin-top: 10px;
            box-shadow: 0 4px 12px rgba(227, 196, 168, 0.4);
            transition: background-color 0.2s;
        }
        .btn:active { transform: scale(0.97); }
        .btn-copy {
            background-color: #b5c496;
            box-shadow: 0 4px 12px rgba(181, 196, 150, 0.4);
            margin-top: 10px;
        }
        textarea {
            width: 100%;
            height: 200px;
            margin-top: 15px;
            border: 2px solid #f0e6d2;
            border-radius: 10px;
            padding: 10px;
            font-family: monospace;
            font-size: 12px;
            background: #fffcf7;
            box-sizing: border-box;
            resize: vertical;
        }
        .note-rule {
            font-size: 12px;
            background: #fffcf7;
            border: 2px solid #f5efe6;
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 15px;
            line-height: 1.6;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>MIDI 譜面コンバーター</h1>
    
    <div class="note-rule">
        <strong>📌 MIDI音程の割り当てルール (C4基準):</strong><br>
        ・ <strong>C3 〜 G3 (48〜55)</strong>：タップ or ロングノーツ（短ければタップ、長ければロング）<br>
        ・ <strong>C4 〜 G4 (60〜67)</strong>：フリックノーツ (◆)<br>
        ・ <strong>C5 〜 G5 (72〜79)</strong>：ピンクのスライド（自動で複数レーンを繋ぐpathを生成）<br>
        ※ レーン（0〜4）は各オクターブ内のC, D, E, F, G（白鍵の5つ）に対応します。
    </div>

    <div class="form-group">
        <label>曲ID (例: song_4)</label>
        <input type="text" id="songId" value="song_4">
    </div>
    <div class="form-group">
        <label>曲名</label>
        <input type="text" id="songTitle" value="新しい曲">
    </div>
    <div class="form-group">
        <label>アーティスト名</label>
        <input type="text" id="songArtist" value="作者名">
    </div>
    <div class="form-group">
        <label>ジャケット画像パス</label>
        <input type="text" id="songJacket" value="🎵">
    </div>
    <div class="form-group">
        <label>音声ファイルパス</label>
        <input type="text" id="songAudio" value="assets/audio/4.mp3">
    </div>
    <div class="form-group">
        <label>MIDIファイルを選択</label>
        <input type="file" id="midiFile" accept=".mid">
    </div>

    <button class="btn" onclick="convertMidi()">譜面データ(.js)を生成する</button>

    <textarea id="outputResult" placeholder="ここに生成されたコードが表示されます..." readonly></textarea>
    
    <button class="btn btn-copy" onclick="copyCode()">生成されたコードをコピーする</button>
</div>

<script>
async function convertMidi() {
    const fileInput = document.getElementById('midiFile');
    if (fileInput.files.length === 0) {
        alert('MIDIファイルを選択してください。');
        return;
    }

    const file = fileInput.files[0];
    const arrayBuffer = await file.arrayBuffer();
    const midi = new Midi(arrayBuffer);

    let chartNotes = [];
    let maxTime = 15;

    midi.tracks.forEach(track => {
        track.notes.forEach(note => {
            let midiNote = note.midi;
            let time = note.time;
            let duration = note.duration;

            if (time + duration > maxTime) {
                maxTime = Math.ceil(time + duration + 2);
            }

            // オクターブ内の音程 (0=C, 1=C#, 2=D, ...) からレーン(0〜4)を決定
            let semitone = midiNote % 12;
            let lane = 0;
            if (semitone === 0) lane = 0;      // C
            else if (semitone === 2) lane = 1; // D
            else if (semitone === 4) lane = 2; // E
            else if (semitone === 5) lane = 3; // F
            else if (semitone === 7) lane = 4; // G
            else {
                lane = Math.min(4, Math.floor(semitone / 2.5));
            }

            let type = 'tap';
            let noteData = {
                time: parseFloat(time.toFixed(3)),
                lane: lane,
                type: 'tap',
                duration: 0,
                noteName: note.name
            };

            // 音域によるノーツ種類の分岐 (C3=48, C4=60, C5=72)
            if (midiNote >= 72 && midiNote < 84) {
                // C5〜G5帯：ピンクのスライド (slidenode)
                let nextLane = (lane < 4) ? lane + 1 : lane - 1;
                noteData.type = 'slidenode';
                noteData.path = [lane, nextLane];
                noteData.direction = (nextLane > lane) ? 'right' : 'left';
            } else if (midiNote >= 60 && midiNote < 72) {
                // C4〜G4帯：フリック
                noteData.type = 'flick';
            } else if (midiNote >= 48 && midiNote < 60) {
                // C3〜G3帯：タップ or ロング
                if (duration > 0.25) {
                    noteData.type = 'long';
                    noteData.duration = parseFloat(duration.toFixed(3));
                } else {
                    noteData.type = 'tap';
                }
            } else {
                noteData.type = (duration > 0.25) ? 'long' : 'tap';
                if (noteData.type === 'long') noteData.duration = parseFloat(duration.toFixed(3));
            }

            chartNotes.push(noteData);
        });
    });

    // 時間順にソート
    chartNotes.sort((a, b) => a.time - b.time);

    const songData = {
        id: document.getElementById('songId').value,
        title: document.getElementById('songTitle').value,
        artist: document.getElementById('songArtist').value,
        jacket: document.getElementById('songJacket').value,
        audioSrc: document.getElementById('songAudio').value,
        duration: maxTime,
        chart: chartNotes
    };

    const outputCode = `window.${songData.id} = ${JSON.stringify(songData, null, 2)};`;
    document.getElementById('outputResult').value = outputCode;
    alert('譜面データの生成が完了しました！');
}

function copyCode() {
    const textarea = document.getElementById('outputResult');
    if (!textarea.value) {
        alert('コピーするコードがありません。先に譜面データを生成してください。');
        return;
    }

    navigator.clipboard.writeText(textarea.value).then(() => {
        alert('コードをクリップボードにコピーしました！');
    }).catch(err => {
        alert('コピーに失敗しました。手動で選択してコピーしてください。');
        console.error(err);
    });
}
</script>

</body>
</html>
