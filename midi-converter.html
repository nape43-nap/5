<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIDI 譜面コンバーター</title>
    <script src="https://cdn.jsdelivr.net/npm/@tonejs/midi@2.0.28/build/Midi.js"></script>
    <style>
        body {
            font-family: sans-serif;
            background: #fdfbf7;
            color: #7c6f64;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
            box-sizing: border-box;
        }
        h2, h3 {
            text-align: center;
        }
        .form-group {
            background: #fff;
            border: 2px solid #f0e6d2;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.02);
        }
        label {
            font-size: 14px;
            font-weight: bold;
            color: #7c6f64;
        }
        input[type="text"], input[type="file"] {
            padding: 10px;
            border: 2px solid #f5efe6;
            border-radius: 8px;
            font-size: 16px;
            background: #fffcf7;
            outline: none;
            width: 100%;
            box-sizing: border-box;
        }
        input[type="text"]:focus {
            border-color: #d4a373;
        }
        textarea {
            width: 100%;
            height: 220px;
            font-family: monospace;
            padding: 12px;
            border: 2px solid #f0e6d2;
            border-radius: 12px;
            box-sizing: border-box;
            background: #fff;
            font-size: 13px;
        }
        .copy-btn {
            background-color: #e3c4a8;
            color: #fff;
            border: none;
            padding: 12px;
            font-size: 16px;
            border-radius: 25px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            font-weight: bold;
            box-shadow: 0 4px 12px rgba(227, 196, 168, 0.4);
        }
        .copy-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <h2>🎵 MIDI 譜面コンバーター (音程自動判別版)</h2>

    <div class="form-group">
        <label>1. 曲ID (半角英数字)</label>
        <input type="text" id="input-id" value="new_song" placeholder="例: twinkle">
    </div>

    <div class="form-group">
        <label>2. 曲名</label>
        <input type="text" id="input-title" value="きらきら星" placeholder="例: きらきら星">
    </div>

    <div class="form-group">
        <label>3. アーティスト名</label>
        <input type="text" id="input-artist" value="フランス民謡" placeholder="例: フランス民謡">
    </div>

    <div class="form-group">
        <label>4. ジャケット画像 (例: 1.jpg または 絵文字)</label>
        <input type="text" id="input-jacket" value="⭐" placeholder="例: ⭐ または 1.jpg">
    </div>

    <div class="form-group">
        <label>5. 音源ファイル (例: 1.mp3)</label>
        <input type="text" id="input-audio" value="1.mp3" placeholder="例: 1.mp3">
    </div>

    <div class="form-group">
        <label>6. MIDIファイル (.mid)</label>
        <input type="file" id="midiFileInput" accept=".mid,.midi">
    </div>

    <h3>出力されたコード</h3>
    <textarea id="output" placeholder="MIDIを選ぶとここにコードが自動生成されます..."></textarea>
    <button class="copy-btn" onclick="copyCode()">コードをコピーする</button>

    <script>
        let parsedNotes = [];
        let songDuration = 15.0;

        document.getElementById('midiFileInput').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const arrayBuffer = await file.arrayBuffer();
            const midi = new Midi(arrayBuffer);

            songDuration = midi.duration;
            parsedNotes = [];

            if (midi.tracks.length > 0) {
                parsedNotes = midi.tracks[0].notes.map(note => {
                    const lane = note.midi % 5;
                    let type = 'tap';

                    // --- 音の高さ（MIDIノート番号）による自動振り分けルール ---
                    // C3 = 48, C4 = 60, C5 = 72
                    if (note.midi >= 72) {
                        // C5以上 ＝ 軌道を描く特殊ノーツ (slide)
                        type = 'slide';
                    } else if (note.midi >= 60 && note.midi < 72) {
                        // C4台 ＝ フリックノーツ (flick)
                        type = 'flick';
                    } else {
                        // C3以下（低い音）＝ 長さによって タップ か ロング を自動判定
                        type = note.duration > 0.4 ? 'long' : 'tap';
                    }
                    
                    let noteObj = {
                        time: Number(note.time.toFixed(2)),
                        lane: lane,
                        type: type
                    };

                    if (type === 'long') {
                        noteObj.duration = Number(note.duration.toFixed(2));
                    }
                    if (note.name) {
                        noteObj.noteName = note.name;
                    }

                    return noteObj;
                });
            }

            let defaultName = file.name.replace(/\.[^/.]+$/, "");
            let safeId = defaultName.toLowerCase().replace(/[^a-z0-9]/g, '_');
            
            document.getElementById('input-id').value = safeId;
            document.getElementById('input-title').value = defaultName;
            document.getElementById('input-jacket').value = safeId + '.jpg';
            document.getElementById('input-audio').value = safeId + '.mp3';

            updateOutputCode();
        });

        ['input-id', 'input-title', 'input-artist', 'input-jacket', 'input-audio'].forEach(id => {
            document.getElementById(id).addEventListener('input', updateOutputCode);
        });

        function updateOutputCode() {
            const songId = document.getElementById('input-id').value || 'song';
            const title = document.getElementById('input-title').value || '';
            const artist = document.getElementById('input-artist').value || '';
            
            let jacketInput = document.getElementById('input-jacket').value.trim() || '🎵';
            let jacketValue = jacketInput.includes('.') && !jacketInput.startsWith('assets/') && !jacketInput.startsWith('http')
                ? `assets/images/${jacketInput}`
                : jacketInput;

            let audioInput = document.getElementById('input-audio').value.trim() || '1.mp3';
            let audioValue = audioInput.includes('.') && !audioInput.startsWith('assets/') && !audioInput.startsWith('http')
                ? `assets/audio/${audioInput}`
                : audioInput;

            const codeOutput = `window.songData_${songId} = {\n` +
                `    id: '${songId}',\n` +
                `    title: '${title}',\n` +
                `    artist: '${artist}',\n` +
                `    jacket: '${jacketValue}',\n` +
                `    audioSrc: '${audioValue}',\n` +
                `    duration: ${songDuration.toFixed(1)},\n` +
                `    chart: ${JSON.stringify(parsedNotes, null, 4).replace(/^/gm, '    ')}\n` +
                `};`;

            document.getElementById('output').value = codeOutput;
        }

        function copyCode() {
            const textarea = document.getElementById('output');
            textarea.select();
            document.execCommand('copy');
            alert('コードをコピーしました！');
        }
    </script>

</body>
</html>
